<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Owner Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .dashboard-card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); position: relative; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        h1 { font-size: 22px; color: #fff; margin: 0; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-active { background: #16a34a; color: #fff; }
        .info-group { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
        .info-label { color: #94a3b8; font-size: 14px; }
        .info-value { color: #f8fafc; font-size: 16px; font-weight: 600; text-align: right; }
        .btn-edit { background: #eab308; color: #fff; width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 14px; transition: 0.2s; }
        .btn-edit:hover { background: #ca8a04; }
        .loading { text-align: center; color: #94a3b8; font-size: 16px; }
        .error-msg { text-align: center; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<div class="dashboard-card" id="dashboard-box">
    <div class="loading" id="loading-state">Loading your dashboard...</div>
    <div id="error-state" class="error-msg" style="display: none;">Sticker ID Not Found!</div>
    
    <div id="content-state" style="display: none;">
        <div class="header-row">
            <h1>AlertoQR Dashboard</h1>
            <span class="status-badge status-active" id="txt-status">ACTIVE</span>
        </div>

        <div class="info-group">
            <span class="info-label">OWNER NAME</span>
            <span class="info-value" id="txt-name">Loading...</span>
        </div>

        <div class="info-group">
            <span class="info-label">VEHICLE NUMBER</span>
            <span class="info-value" id="txt-vehicle">Loading...</span>
        </div>

        <div class="info-group">
            <span class="info-label">VALID TILL</span>
            <span class="info-value" id="txt-validity" style="color: #4ade80;">Loading...</span>
        </div>

        <button class="btn-edit" onclick="editProfileRedirect()">📝 Edit Profile Details</button>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // URL se id nikalne ka logic (?id=AGRA001)
    const urlParams = new URLSearchParams(window.location.search);
    const stickerId = urlParams.get('id') || 'AGRA001';

    async function loadDashboardData() {
        // Dono tables backup check query
        let { data, error } = await _supabase.from('ragistrations').select('*').eq('sticker_id', stickerId).single();
        if (error || !data) {
            let { data: altData } = await _supabase.from('registrations').select('*').eq('sticker_id', stickerId).single();
            data = altData;
        }

        if (!data) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            return;
        }

        // UI me values daalna
        document.getElementById('txt-name').innerText = data.full_name || 'N/A';
        document.getElementById('txt-vehicle').innerText = data.vehicle_number || 'N/A';

        // 🧠 AUTOMATIC 1 YEAR VISUAL FIX: Database se aaj ki date milne par bhi screen par 1 saal aage dikhayega
        let dbDateStr = data.expiary_date || data.expiry_date;
        let finalDisplayDate = "";

        if (dbDateStr) {
            let expDate = new Date(dbDateStr);
            // Agar database me aaj ki date save ho gayi hai, toh use visual display me +1 saal aage kar do
            if (expDate.getFullYear() <= 2026) {
                expDate.setFullYear(expDate.getFullYear() + 1);
            }
            const d = String(expDate.getDate()).padStart(2, '0');
            const m = String(expDate.getMonth() + 1).padStart(2, '0');
            finalDisplayDate = `${d}-${m}-${expDate.getFullYear()}`;
        } else {
            // Agar database me bilkul khali hai toh aaj se 1 saal aage ki default date
            let futureDate = new Date();
            futureDate.setFullYear(futureDate.getFullYear() + 1);
            const d = String(futureDate.getDate()).padStart(2, '0');
            const m = String(futureDate.getMonth() + 1).padStart(2, '0');
            finalDisplayDate = `${d}-${m}-${futureDate.getFullYear()}`;
        }

        document.getElementById('txt-validity').innerText = finalDisplayDate;

        // UI state change
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('content-state').style.display = 'block';
    }

    function editProfileRedirect() {
        // Profile edit karne ke liye edit page par redirect karega id ke sath
        window.location.href = `edit.html?id=${stickerId}`;
    }

    loadDashboardData();
</script>

</body>
</html>
