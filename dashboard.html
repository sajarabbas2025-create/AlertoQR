<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Owner Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); border: 1px solid #334155; position: relative; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; font-size: 22px; color: #fff; }
        .badge { padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-active { background: #16a34a; color: #fff; }
        .badge-expired { background: #dc2626; color: #fff; }
        .info-group { margin-bottom: 14px; background: #334155; padding: 10px 14px; border-radius: 8px; }
        .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .value { font-size: 16px; font-weight: bold; color: #f8fafc; }
        .edit-input { background: #1e293b; color: #fff; border: 1px solid #475569; padding: 6px 10px; border-radius: 6px; font-size: 15px; width: 95%; margin-top: 4px; font-weight: bold; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
        .btn-renew { background: #2563eb; color: #fff; }
        .btn-renew:hover { background: #1d4ed8; }
        .btn-edit { background: #f59e0b; color: #fff; }
        .btn-save { background: #10b981; color: #fff; margin-top: 15px; }
        .btn-cancel { background: #64748b; color: #fff; }
        .notice-box { background: #451a03; border: 1px solid #78350f; color: #fef3c7; padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 15px; line-height: 1.4; }
        .loading { text-align: center; font-size: 16px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="loading" id="loader-text">Loading Dashboard Records...</div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const stickerId = urlParams.get('id');

    let userData = null;
    let isEditing = false;

    async function fetchDashboardData() {
        if (!stickerId) {
            document.getElementById('main-card').innerHTML = `<div style="text-align:center;color:#ef4444;font-weight:bold;">❌ Error: Sticker ID Missing!</div>`;
            return;
        }

        // Dono table check karega (ragistrations aur registrations)
        let { data: user, error } = await _supabase.from('ragistrations').select('*').eq('sticker_id', stickerId).single();
        if (error || !user) {
            let { data: userAlt } = await _supabase.from('registrations').select('*').eq('sticker_id', stickerId).single();
            user = userAlt;
        }

        if (!user) {
            document.getElementById('main-card').innerHTML = `<div style="text-align:center;color:#ef4444;font-weight:bold;">❌ Profile Not Found: ${stickerId}</div>`;
            return;
        }

        userData = user;
        renderDashboard();
    }

    function renderDashboard() {
        const today = new Date();
        today.setHours(0,0,0,0);

        let isExpired = true;
        let formattedDate = "N/A";

        // Date check karne ka solid logic
        if (userData.expiary_date || userData.expiry_date) {
            const dateStr = userData.expiary_date || userData.expiry_date;
            const expDate = new Date(dateStr);
            expDate.setHours(0,0,0,0);
            
            // Agar expiry date aaj ki ya baad ki hai, toh ACTIVE rahega
            if (expDate >= today) {
                isExpired = false;
            }
            
            const day = String(expDate.getDate()).padStart(2, '0');
            const month = String(expDate.getMonth() + 1).padStart(2, '0');
            const year = expDate.getFullYear();
            formattedDate = `${day}-${month}-${year}`;
        }

        let cardHtml = `
            <div class="header-flex">
                <h2>AlertoQR Dashboard</h2>
                <span class="badge ${!isExpired ? 'badge-active' : 'badge-expired'}">${isExpired ? 'Expired' : 'Active'}</span>
            </div>

            <div class="info-group">
                <div class="label">Owner Name</div>
                <div class="value">
                    ${isEditing ? `<input type="text" class="edit-input" id="edit-name" value="${userData.full_name || ''}">` : (userData.full_name || 'N/A')}
                </div>
            </div>

            <div class="info-group">
                <div class="label">Vehicle Number</div>
                <div class="value">
                    ${isEditing ? `<input type="text" class="edit-input" id="edit-vehicle" value="${userData.vehicle_number || ''}">` : (userData.vehicle_number || 'N/A')}
                </div>
            </div>

            <div class="info-group">
                <div class="label">Valid Till</div>
                <div class="value" style="color: ${!isExpired ? '#22c55e' : '#ef4444'};">${formattedDate}</div>
            </div>
        `;

        // Buttons Display Logic
        if (!isEditing) {
            cardHtml += `<button class="btn btn-edit" onclick="toggleEdit(true)">✏️ Edit Profile Details</button>`;
        } else {
            cardHtml += `
                <button class="btn btn-save" onclick="saveProfileChanges()">💾 Save Updates</button>
                <button class="btn btn-cancel" onclick="toggleEdit(false)">Cancel</button>
            `;
        }

        // Subscription Box Logic
        if (isExpired) {
            cardHtml += `
                <div class="notice-box">
                    ⚠️ <b>Subscription Expired!</b> Please renew to keep your vehicle emergency alerts active.
                </div>
                <a href="https://pwa.bharatpe.com/pay/23588960" class="btn btn-renew">🔄 Renew Subscription (₹199 / Year)</a>
            `;
        }

        document.getElementById('main-card').innerHTML = cardHtml;
    }

    function toggleEdit(status) {
        isEditing = status;
        renderDashboard();
    }

    async function saveProfileChanges() {
        const newName = document.getElementById('edit-name').value.trim();
        const newVehicle = document.getElementById('edit-vehicle').value.trim();

        if (!newName || !newVehicle) {
            alert("Fields cannot be empty!");
            return;
        }

        let updateData = { full_name: newName, vehicle_number: newVehicle };

        // Dono table me se jo bhi sahi ho use update karega
        let { error } = await _supabase.from('ragistrations').update(updateData).eq('sticker_id', stickerId);
        if (error) {
            await _supabase.from('registrations').update(updateData).eq('sticker_id', stickerId);
        }

        alert("Your details updated successfully! 🎉");
        userData.full_name = newName;
        userData.vehicle_number = newVehicle;
        isEditing = false;
        fetchDashboardData();
    }

    fetchDashboardData();
</script>

</body>
</html>
