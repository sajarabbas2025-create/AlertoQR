<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Gatekeeper</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader-box { text-align: center; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #38bdf8; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px; font-size: 20px; }
        p { color: #94a3b8; margin: 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="loader-box">
    <div class="spinner"></div>
    <h2 id="status-title">Checking Sticker Status...</h2>
    <p id="status-desc">Please wait while we route your request.</p>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // URL se ID nikalne ke liye (?id=ALQR001)
    const urlParams = new URLSearchParams(window.location.search);
    const stickerId = urlParams.get('id');

    async function routeUser() {
        if (!stickerId) {
            document.getElementById('status-title').innerText = "Invalid QR Code";
            document.getElementById('status-desc').innerText = "No Sticker ID found in the URL.";
            return;
        }

        try {
            // Supabase Database mein check karo ki yeh ID pehle se registered hai ya nahi
            let { data, error } = await _supabase
                .from('registrations')
                .select('*')
                .eq('sticker_id', stickerId)
                .maybeSingle();

            if (error) throw error;

            if (data) {
                // Case A: Agar data mil gaya, toh yeh purana user hai -> Isko Iski Profile/Dashboard par bhejo
                document.getElementById('status-title').innerText = "User Found!";
                document.getElementById('status-desc').innerText = "Opening Owner Profile...";
                
                // Yahan hum isi page par data show kar sakte hain ya register.html par view mode me bhej sakte hain.
                // Abhi ke liye testing ke liye hum isko register.html par view mode me bhej rahe hain:
                window.location.href = `register.html?id=${stickerId}&mode=view`;
            } else {
                // Case B: Agar data nahi mila, toh yeh naya sticker hai -> Isko Registration Form par bhejo
                document.getElementById('status-title').innerText = "Fresh Sticker Detected!";
                document.getElementById('status-desc').innerText = "Redirecting to Registration Form...";
                window.location.href = `register.html?id=${stickerId}`;
            }

        } catch (err) {
            console.error(err);
            document.getElementById('status-title').innerText = "Connection Error";
            document.getElementById('status-desc').innerText = "Could not connect to database. Please refresh.";
        }
    }

    // Run the routing logic on load
    routeUser();
</script>
</body>
</html>
