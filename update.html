<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR - Update Profile</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 16px; }
        .header { text-align: center; margin-bottom: 30px; width: 100%; max-width: 400px; }
        .logo { font-size: 26px; font-weight: 800; color: #ffffff; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #94a3b8; font-weight: 500; }
        
        .form-container { width: 100%; max-width: 400px; background: #1e293b; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid #334155; margin-bottom: 20px; }
        .input-group { margin-bottom: 18px; }
        .input-label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: #64748b; font-size: 16px; }
        .input-field { width: 100%; padding: 14px 14px 14px 42px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #ffffff; font-size: 15px; font-weight: 600; outline: none; transition: 0.2s; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .btn-main { width: 100%; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; background: #22c55e; color: #ffffff; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; transition: 0.2s; }
        .text-link { color: #3b82f6; font-size: 13px; font-weight: 600; text-align: right; display: block; margin-top: -10px; margin-bottom: 15px; cursor: pointer; text-decoration: none; }
        
        .status-msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; display: none; }
        .success { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">Update Profile</div>
    <div class="subtitle">Manage your AlertoQR details securely</div>
</div>

<div id="login-section" class="form-container">
    <div class="input-group">
        <label class="input-label">Sticker ID *</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-qrcode"></i><input type="text" id="login-id" class="input-field" placeholder="ALQR1001" style="text-transform: uppercase;">
        </div>
    </div>
    <div class="input-group">
        <label class="input-label">4-Digit Security PIN *</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i><input type="password" id="login-pin" class="input-field" placeholder="****" maxlength="4" inputmode="numeric">
        </div>
    </div>
    <a class="text-link" onclick="showSection('forgot-section')">Forgot PIN?</a>
    <button class="btn-main" onclick="processLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login Securely</button>
    <div id="login-msg" class="status-msg"></div>
</div>

<div id="forgot-section" class="form-container" style="display: none;">
    <div style="margin-bottom: 20px; font-size: 14px; color: #cbd5e1; text-align: center;">Verify identity to reset your PIN</div>
    <div class="input-group">
        <label class="input-label">Sticker ID *</label>
        <div class="input-wrapper"><i class="fa-solid fa-qrcode"></i><input type="text" id="reset-id" class="input-field" placeholder="ALQR1001" style="text-transform: uppercase;"></div>
    </div>
    <div class="input-group">
        <label class="input-label">Vehicle Number *</label>
        <div class="input-wrapper"><i class="fa-solid fa-car"></i><input type="text" id="reset-veh" class="input-field" placeholder="UP32DD2420" style="text-transform: uppercase;"></div>
    </div>
    <div class="input-group">
        <label class="input-label">Chassis No. (Last 4 Digits) *</label>
        <div class="input-wrapper"><i class="fa-solid fa-fingerprint"></i><input type="text" id="reset-chassis" class="input-field" placeholder="Last 4 digits" maxlength="4"></div>
    </div>
    <div class="input-group" id="new-pin-group" style="display: none;">
        <label class="input-label" style="color: #4ade80;">Create New 4-Digit PIN *</label>
        <div class="input-wrapper"><i class="fa-solid fa-key" style="color: #4ade80;"></i><input type="password" id="new-set-pin" class="input-field" placeholder="****" maxlength="4" inputmode="numeric" style="border-color: #4ade80;"></div>
    </div>
    <button id="btn-verify-reset" class="btn-main" onclick="verifyForReset()"><i class="fa-solid fa-shield-check"></i> Verify Details</button>
    <a class="text-link" style="text-align: center; margin-top: 15px;" onclick="showSection('login-section')">Back to Login</a>
    <div id="forgot-msg" class="status-msg"></div>
</div>

<div id="update-section" class="form-container" style="display: none;">
    <div style="margin-bottom: 20px; text-align: center;">
        <span style="background: #3b82f6; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold;" id="display-sticker"></span>
    </div>

    <div class="input-group">
        <label class="input-label">Owner Full Name *</label>
        <div class="input-wrapper"><i class="fa-solid fa-user"></i><input type="text" id="upd-name" class="input-field"></div>
    </div>
    <div class="input-group">
        <label class="input-label">WhatsApp Mobile Number *</label>
        <div class="input-wrapper"><i class="fa-solid fa-phone"></i><input type="tel" id="upd-mobile" class="input-field" maxlength="10"></div>
    </div>
    <div class="input-group">
        <label class="input-label">Alternate Number (Optional)</label>
        <div class="input-wrapper"><i class="fa-solid fa-mobile-screen"></i><input type="tel" id="upd-alt" class="input-field" maxlength="10"></div>
    </div>
    
    <div class="input-group" style="margin-top: 25px; border-top: 1px solid #334155; padding-top: 20px;">
        <label class="input-label" style="color: #f59e0b;">Change Security PIN (Optional)</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-key" style="color: #f59e0b;"></i>
            <input type="password" id="upd-pin" class="input-field" maxlength="4" placeholder="Enter new 4-digit PIN" inputmode="numeric">
        </div>
        <span style="font-size: 11px; color: #64748b; margin-top: 5px; display: block;">Leave blank if you don't want to change your PIN.</span>
    </div>
    
    <button class="btn-main" onclick="saveProfile()"><i class="fa-solid fa-check-circle"></i> Save Updates</button>
    <div id="update-msg" class="status-msg"></div>
</div>

<script>
    const databaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const databaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(databaseUrl, databaseKey);

    let loggedInId = "";
    let isResetVerified = false;

    function showSection(sectionId) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('forgot-section').style.display = 'none';
        document.getElementById('update-section').style.display = 'none';
        document.getElementById(sectionId).style.display = 'block';
    }

    function showMsg(elementId, text, type) {
        const msgBox = document.getElementById(elementId);
        msgBox.innerText = text; msgBox.className = `status-msg ${type}`; msgBox.style.display = 'block';
        setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
    }

    async function processLogin() {
        const id = document.getElementById('login-id').value.trim().toUpperCase();
        const pin = document.getElementById('login-pin').value.trim();
        if(!id || pin.length !== 4) { showMsg('login-msg', "Sahi ID aur 4-digit PIN daalein.", "error"); return; }

        try {
            const { data, error } = await _supabase.from('registrations').select('*').eq('sticker_id', id).single();
            if (error || !data) { showMsg('login-msg', "Ye ID register nahi hai.", "error"); return; }
            if(data.secret_pin && data.secret_pin.toString() === pin) {
                loggedInId = id;
                document.getElementById('display-sticker').innerText = id;
                document.getElementById('upd-name').value = data.full_name || data.owner_name || '';
                document.getElementById('upd-mobile').value = data.mobile_number || '';
                document.getElementById('upd-alt').value = data.alternate_number || ''; 
                showSection('update-section');
            } else { showMsg('login-msg', "Galat PIN! Kripya dobara try karein.", "error"); }
        } catch(err) { showMsg('login-msg', "Network Error", "error"); }
    }

    async function verifyForReset() {
        const id = document.getElementById('reset-id').value.trim().toUpperCase();
        const veh = document.getElementById('reset-veh').value.replace(/\s+/g, '').toUpperCase();
        const chas = document.getElementById('reset-chassis').value.trim();

        if(!isResetVerified) {
            if(!id || !veh || chas.length !== 4) { showMsg('forgot-msg', "Saari details sahi format mein daalein.", "error"); return; }
            try {
                const { data, error } = await _supabase.from('registrations').select('*').eq('sticker_id', id).eq('vehicle_number', veh).single();
                if (error || !data) { showMsg('forgot-msg', "Galat details! Record match nahi hua.", "error"); return; }
                if(data.chassis_no && data.chassis_no.toString().slice(-4) === chas) {
                    showMsg('forgot-msg', "Details Verified! Naya PIN set karein.", "success");
                    isResetVerified = true;
                    document.getElementById('new-pin-group').style.display = 'block';
                    document.getElementById('btn-verify-reset').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Update New PIN';
                    document.getElementById('reset-id').disabled = true; document.getElementById('reset-veh').disabled = true; document.getElementById('reset-chassis').disabled = true;
                } else { showMsg('forgot-msg', "Galat Chassis Number!", "error"); }
            } catch(err) { showMsg('forgot-msg', "Network Error", "error"); }
        } else {
            const newPin = document.getElementById('new-set-pin').value.trim();
            if(newPin.length !== 4) { showMsg('forgot-msg', "Naya PIN 4 digit ka hona chahiye.", "error"); return; }
            try {
                const { error } = await _supabase.from('registrations').update({ secret_pin: newPin }).eq('sticker_id', id);
                if (error) throw error;
                showMsg('forgot-msg', "PIN successfully reset ho gaya!", "success");
                setTimeout(() => { window.location.reload(); }, 2000);
            } catch(err) { showMsg('forgot-msg', "Update fail hua. Try again.", "error"); }
        }
    }

    async function saveProfile() {
        const name = document.getElementById('upd-name').value.trim();
        const mobile = document.getElementById('upd-mobile').value.trim();
        const alt = document.getElementById('upd-alt').value.trim();
        const newPin = document.getElementById('upd-pin').value.trim();

        if(!name || mobile.length !== 10) { showMsg('update-msg', "Naam aur sahi Mobile No. daalna zaroori hai.", "error"); return; }

        let updateData = { 
            full_name: name, 
            owner_name: name,
            mobile_number: mobile,
            alternate_number: alt
        };

        // Agar customer ne naya PIN daala hai, toh usko bhi update karo
        if (newPin.length > 0) {
            if (newPin.length !== 4) {
                showMsg('update-msg', "Naya PIN 4 digit ka hona chahiye.", "error"); return;
            }
            updateData.secret_pin = newPin;
        }

        try {
            const { error } = await _supabase.from('registrations').update(updateData).eq('sticker_id', loggedInId);
            if(error) throw error;
            
            if (newPin.length === 4) {
                showMsg('update-msg', "Profile & PIN dono update ho gaye!", "success");
                document.getElementById('upd-pin').value = ""; // clear after save
            } else {
                showMsg('update-msg', "Profile details update ho gayi!", "success");
            }
        } catch(err) { showMsg('update-msg', "Data save nahi hua. Check network.", "error"); }
    }
</script>

</body>
</html>
