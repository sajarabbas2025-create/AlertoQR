<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR Safety | Register Smart Sticker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        input::placeholder {
            color: #475569;
        }
        input[readonly] {
            background-color: #1e293b;
            border-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .error-msg {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            text-align: center;
            line-height: 1.4;
        }
        .success-msg {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>AlertoQR Safety</h2>
    <div class="subtitle">Register & Activate Your Smart Sticker</div>

    <form id="registration-form" onsubmit="handleRegistration(event)">
        <div class="form-group">
            <label for="sticker_id">Sticker Serial ID</label>
            <input type="text" id="sticker_id" placeholder="e.g. ALQR001" required readonly>
        </div>

        <div class="form-group">
            <label for="full_name">Owner Full Name</label>
            <input type="text" id="full_name" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label for="mobile_number">Mobile Number (For Emergency Alerts)</label>
            <input type="tel" id="mobile_number" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
        </div>

        <div class="form-group">
            <label for="vehicle_number">Vehicle Plate Number</label>
            <input type="text" id="vehicle_number" placeholder="e.g. UP32PD2478" style="text-transform: uppercase;" required>
        </div>

        <div class="form-group">
            <label for="secret_pin">Create 4-Digit Secret PIN (To Edit Details Later)</label>
            <input type="password" id="secret_pin" placeholder="••••" maxlength="4" pattern="[0-9]{4}" title="Please enter a 4-digit number PIN" required>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">📝 SUBMIT DETAILS</button>
    </form>

    <div class="error-msg" id="error-box"></div>
    <div class="success-msg" id="success-box">✨ Details saved successfully! Your sticker is now active.</div>
</div>

<script>
    // Supabase Credentials
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // URL se Automatic Sticker ID nikalne ke liye
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlStickerId = urlParams.get('id');
        
        if (urlStickerId) {
            document.getElementById('sticker_id').value = urlStickerId.trim().toUpperCase();
        } else {
            // Agar link me ID na ho toh input field open rakhein taaki khud dal sakein
            document.getElementById('sticker_id').removeAttribute('readonly');
            document.getElementById('sticker_id').placeholder = "Enter Serial ID (e.g. ALQR001)";
        }
    });

    // Registration Handler Form Logic
    async function handleRegistration(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');

        // Reset Displays
        errorBox.style.display = 'none';
        successBox.style.display = 'none';
        submitBtn.innerText = "Saving Data... Please wait...";
        submitBtn.disabled = true;

        const stickerIdValue = document.getElementById('sticker_id').value.trim().toUpperCase();
        const fullNameValue = document.getElementById('full_name').value.trim();
        const mobileNumberValue = document.getElementById('mobile_number').value.trim();
        const vehicleNumberValue = document.getElementById('vehicle_number').value.trim().toUpperCase();
        const secretPinValue = document.getElementById('secret_pin').value.trim();

        try {
            // Sahi database columns mapped (Fixed 'mobile_number' schema tracking)
            const { data, error } = await _supabase
                .from('registrations')
                .insert([
                    { 
                        sticker_id: stickerIdValue, 
                        full_name: fullNameValue, 
                        mobile_number: mobileNumberValue, // Yeh exact column name hai database me
                        vehicle_number: vehicleNumberValue, 
                        secret_pin: secretPinValue,
                        status: 'Pending' // Admin panel se verification hone tak pending
                    }
                ]);

            if (error) {
                throw error;
            }

            // Success Display
            successBox.style.display = 'block';
            document.getElementById('registration-form').reset();
            submitBtn.innerText = "📝 SUBMIT DETAILS";
            submitBtn.disabled = false;
            
            alert("Congratulations! Registration details submitted successfully.");

        } catch (err) {
            console.error("Write Exception Handled Logs:", err);
            errorBox.innerText = `Error saving details: ${err.message || 'Check your internet or Supabase schema setup.'}`;
            errorBox.style.display = 'block';
            submitBtn.innerText = "📝 SUBMIT DETAILS";
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
