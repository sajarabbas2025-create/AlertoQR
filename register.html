<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AlertoQR - Vehicle Registration</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .header-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px 15px 4px;
            margin-bottom: 25px;
            border-bottom: 1px solid #f1f5f9;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #000000;
        }

        .sticker-id-tag {
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        .instruction-text {
            font-size: 14px;
            color: #475569;
            margin-bottom: 25px;
            line-height: 1.5;
            padding: 0 4px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 14px 14px 14px 42px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #000000;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #000000;
        }

        .btn-submit {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            border-radius: 8px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn-submit:active {
            opacity: 0.8;
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 0;
            color: #64748b;
            font-weight: 600;
        }

        #error-screen {
            display: none;
            color: #ef4444;
            text-align: center;
            padding: 60px 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 28px; color: #000; margin-bottom: 16px;"></i>
        <div>Initializing Setup Window...</div>
    </div>

    <div id="registration-view" style="display: none !important;">
        
        <div class="header-strip">
            <span class="header-title">Activate Sticker</span>
            <span class="sticker-id-tag" id="lbl-sticker-id">ID: ----</span>
        </div>

        <p class="instruction-text">
            Enter your vehicle and contact details below to link this smart safety QR sticker to your profile instantly.
        </p>

        <form id="form-register">
            <div class="form-group">
                <label for="txt-owner-name">Owner Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="txt-owner-name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-mobile">WhatsApp Mobile Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="txt-mobile" class="form-control" placeholder="10 Digit Number" pattern="[0-9]{10}" title="Please enter valid 10 digit number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-alternate">Alternate Mobile Number <span style="color: #94a3b8; font-weight: normal; font-size: 11px;">(Optional)</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <input type="tel" id="txt-alternate" class="form-control" placeholder="Backup Contact Number (10 Digits)" pattern="[0-9]{10}" title="Please enter valid 10 digit number">
                </div>
            </div>

            <div class="form-group">
                <label for="txt-vehicle">Vehicle Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-car"></i>
                    <input type="text" id="txt-vehicle" class="form-control" placeholder="e.g. UP80AB1234" style="text-transform: uppercase;" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-chassis">Chassis No. (Last 4 Digits)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-fingerprint"></i>
                    <input type="text" id="txt-chassis" class="form-control" placeholder="Forgot PIN ke waqt security ke liye" maxlength="4" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-pin">Set Secret Security PIN</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="txt-pin" class="form-control" placeholder="4 Digit Number PIN" pattern="[0-9]{4}" title="Please enter 4 digit numeric PIN" required>
                </div>
            </div>

            <button type="submit" id="btn-save-action" class="btn-submit">
                <i class="fa-solid fa-circle-check"></i> Submit & Activate Sticker
            </button>
        </form>

    </div>

    <div id="error-screen">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 32px; margin-bottom: 12px;"></i>
        <div id="error-message-text">Sticker setup configuration missing.</div>
    </div>

</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let cleanStickerId = "";

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (!urlParams.has('v')) {
            urlParams.set('v', Date.now());
            window.location.search = urlParams.toString();
            return;
        }

        const stickerId = urlParams.get('id');
        if (!stickerId || stickerId.trim() === "") {
            showErrorState("Scan Error: Missing Sticker ID Parameter.");
            return;
        }

        cleanStickerId = stickerId.trim().toUpperCase();
        document.getElementById('lbl-sticker-id').innerText = `ID: ${cleanStickerId}`;

        try {
            const { data, error } = await _supabase
                .from('registrations')
                .select('status')
                .eq('sticker_id', cleanStickerId)
                .maybeSingle();

            if (error) {
                showErrorState("Database connection error.");
                return;
            }

            if (data && data.status === 'Active') {
                window.location.href = `helper.html?id=${cleanStickerId}`;
                return;
            }

            document.getElementById('loading-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('registration-view').style.setProperty('display', 'block', 'important');

        } catch (err) {
            showErrorState("System configuration failure.");
        }
    });

    document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const ownerName = document.getElementById('txt-owner-name').value.trim();
        const mobileNumber = document.getElementById('txt-mobile').value.trim();
        const alternateNumber = document.getElementById('txt-alternate').value.trim();
        const vehicleNumber = document.getElementById('txt-vehicle').value.trim().toUpperCase();
        const chassisNumber = document.getElementById('txt-chassis').value.trim();
        const secretPin = document.getElementById('txt-pin').value.trim();
        
        const btnSave = document.getElementById('btn-save-action');
        btnSave.disabled = true;
        btnSave.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Activating Live...';

        try {
            const { data, error } = await _supabase.rpc('register_qrcode_sticker', {
                p_sticker_id: cleanStickerId,
                p_full_name: ownerName,
                p_mobile_number: mobileNumber,
                p_alternate_number: alternateNumber || null,
                p_vehicle_number: vehicleNumber,
                p_chassis_number: chassisNumber, // Maps seamlessly into server side function architecture
                p_secret_pin: secretPin
            });

            if (error) {
                alert("Registration failed: " + error.message);
                btnSave.disabled = false;
                btnSave.innerHTML = '<i class="fa-solid fa-circle-check"></i> Submit & Activate Sticker';
                return;
            }

            alert("🎉 Your Smart AlertoQR Sticker is Now Live and Active!");
            window.location.href = `helper.html?id=${cleanStickerId}`;

        } catch (err) {
            alert("Network connection error. Try again.");
            btnSave.disabled = false;
            btnSave.innerHTML = '<i class="fa-solid fa-circle-check"></i> Submit & Activate Sticker';
        }
    });

    function showErrorState(msg) {
        document.getElementById('loading-screen').style.setProperty('display', 'none', 'important');
        document.getElementById('error-message-text').innerText = msg;
        document.getElementById('error-screen').style.setProperty('display', 'block', 'important');
    }
</script>
</body>
</html>
