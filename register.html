<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR Safety | Register Smart Sticker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        input[readonly] {
            background-color: #1e293b;
            border-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .error-msg {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            text-align: center;
            line-height: 1.4;
        }
        .payment-box {
            background-color: rgba(56, 189, 248, 0.1);
            border: 2px dashed #38bdf8;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .payment-price {
            font-size: 32px;
            font-weight: 800;
            color: #fbbf24;
            margin: 10px 0;
        }
        .btn-pay {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            margin-top: 12px;
        }
        .qr-wrapper {
            background: white;
            padding: 12px;
            border-radius: 8px;
            display: inline-block;
            margin: 15px auto;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>AlertoQR Safety</h2>
    <div class="subtitle">Register & Activate Your Smart Sticker</div>

    <form id="registration-form" onsubmit="handleRegistration(event)">
        <div class="form-group">
            <label>Sticker Serial ID</label>
            <input type="text" id="sticker_id" placeholder="e.g. ALQR001" required readonly>
        </div>

        <div class="form-group">
            <label>Owner Full Name</label>
            <input type="text" id="full_name" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="mobile_number" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label>Vehicle Plate Number</label>
            <input type="text" id="vehicle_number" placeholder="e.g. UP32PD2478" style="text-transform: uppercase;" required>
        </div>

        <div class="form-group">
            <label>Create 4-Digit Secret PIN</label>
            <input type="password" id="secret_pin" placeholder="••••" maxlength="4" pattern="[0-9]{4}" required>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">📝 SUBMIT & PROCEED TO PAY</button>
    </form>

    <div class="error-msg" id="error-box"></div>

    <div class="payment-box" id="payment-container">
        <div style="font-size: 14px; color: #cbd5e1; font-weight: 600;">🔒 STEP 2: COMPLETE ACTIVATION PAYMENT</div>
        <div class="payment-price">₹299 <span style="font-size:14px; color:#94a3b8; font-weight:normal;">/ Yearly</span></div>
        <a href="#" class="btn-pay" id="upi-pay-link">⚡ PAY WITH UPI APP</a>
        <div class="qr-wrapper"><div id="qrcode"></div></div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const BUSINESS_UPI_ID = "6388522427@ptsbi"; 
    const BUSINESS_NAME = "SAJAR ABBAS";

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlStickerId = urlParams.get('id');
        if (urlStickerId) document.getElementById('sticker_id').value = urlStickerId.trim().toUpperCase();
    });

    async function handleRegistration(event) {
        event.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');
        
        errorBox.style.display = 'none';
        submitBtn.innerText = "Checking Details...";
        submitBtn.disabled = true;

        const stickerId = document.getElementById('sticker_id').value.trim().toUpperCase();
        const vehicleNumber = document.getElementById('vehicle_number').value.trim().toUpperCase();

        try {
            // 🛑 CHECK FOR DUPLICATES
            const { data: existingRecords, error: checkError } = await _supabase
                .from('registrations')
                .select('sticker_id, vehicle_number')
                .or(`sticker_id.eq.${stickerId},vehicle_number.eq.${vehicleNumber}`);

            if (checkError) throw checkError;

            if (existingRecords && existingRecords.length > 0) {
                let matched = existingRecords[0];
                if(matched.sticker_id === stickerId) {
                    throw new Error(`🛑 Sticker ID ${stickerId} pehle se registered hai! Ek sticker do baar register nahi ho sakta.`);
                } else {
                    throw new Error(`🛑 Vehicle Number ${vehicleNumber} pehle se registered hai!`);
                }
            }

            // Insert data if unique
            const { error: insertError } = await _supabase.from('registrations').insert([{ 
                sticker_id: stickerId, 
                full_name: document.getElementById('full_name').value.trim(), 
                mobile_number: document.getElementById('mobile_number').value.trim(), 
                vehicle_number: vehicleNumber, 
                secret_pin: document.getElementById('secret_pin').value.trim(),
                status: 'Pending' 
            }]);

            if (insertError) throw insertError;

            const upiUrl = `upi://pay?pa=${BUSINESS_UPI_ID}&pn=${encodeURIComponent(BUSINESS_NAME)}&am=299.00&cu=INR&tn=${encodeURIComponent('Activation ' + stickerId)}`;
            document.getElementById('upi-pay-link').href = upiUrl;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: upiUrl, width: 160, height: 160 });

            document.getElementById('registration-form').style.display = 'none';
            document.getElementById('payment-container').style.display = 'block';

        } catch (err) {
            errorBox.innerText = err.message;
            errorBox.style.display = 'block';
            submitBtn.innerText = "📝 SUBMIT & PROCEED TO PAY";
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
