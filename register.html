<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Registration - AlertoQR</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #0056b3; margin-bottom: 5px; }
        .id-badge { color: #d9534f; font-weight: bold; margin-bottom: 20px; display: block; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #004494; }
    </style>
</head>
<body>

<div class="card">
    <h2>Vehicle Registration</h2>
    <span class="id-badge">Sticker ID: <span id="sticker-id-display">Detecting...</span></span>

    <input type="text" id="full-name" placeholder="Full Name" required>
    <input type="text" id="vehicle-number" placeholder="Vehicle Number (e.g. UP80...)" required>
    <input type="tel" id="phone-number" placeholder="Mobile Number" required>
    
    <button id="save-btn" onclick="saveData()" disabled>Save Details</button>
    <p id="status-msg" style="margin-top:15px;"></p>
</div>

<script>
    // 1. Supabase Setup (Apni keys yahan check karein)
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co'; 
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; // <--- Yahan apni Anon Key dalein
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. URL se ID nikaalna
    const urlParams = new URLSearchParams(window.location.search);
    const stickerId = urlParams.get('id');

    const displayElement = document.getElementById('sticker-id-display');
    const saveBtn = document.getElementById('save-btn');

    if (stickerId) {
        displayElement.textContent = stickerId;
        displayElement.style.color = "green";
        saveBtn.disabled = false; // ID milte hi button unlock ho jayega
    } else {
        displayElement.textContent = "Not Found (Link Error)";
    }

    // 3. Data Save karne ka function
    async function saveData() {
        const fullName = document.getElementById('full-name').value;
        const vehicleNumber = document.getElementById('vehicle-number').value;
        const phoneNumber = document.getElementById('phone-number').value;
        const msg = document.getElementById('status-msg');

        if(!fullName || !vehicleNumber || !phoneNumber) {
            alert("Please fill all fields");
            return;
        }

        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;

        const { data, error } = await supabase
            .from('registrations')
            .insert([
                { 
                    sticker_id: stickerId, 
                    full_name: fullName, 
                    vehicle_number: vehicleNumber, 
                    phone_number: phoneNumber 
                }
            ]);

        if (error) {
            console.error(error);
            msg.innerText = "Error: " + error.message;
            msg.style.color = "red";
            saveBtn.innerText = "Save Details";
            saveBtn.disabled = false;
        } else {
            msg.innerText = "Registration Successful!";
            msg.style.color = "green";
            saveBtn.innerText = "Saved!";
        }
    }
</script>

</body>
</html>
