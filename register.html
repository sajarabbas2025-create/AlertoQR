<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR Safety | Register Smart Sticker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .form-container { 
            background-color: #1e293b; 
            padding: 30px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 450px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h2 { 
            text-align: center; 
            color: #38bdf8; 
            margin: 0 0 8px 0; 
            font-size: 24px;
            font-weight: 700;
        }
        .subtitle { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 14px; 
            margin-bottom: 24px; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 12px; 
            font-weight: 600; 
            color: #94a3b8; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #475569; 
            background-color: #0f172a; 
            color: #fff; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
        }
        input:focus { 
            outline: none; 
            border-color: #38bdf8; 
        }
        input[readonly] { 
            background-color: #1e293b; 
            border-color: #334155; 
            color: #64748b; 
            cursor: not-allowed; 
        }
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        .btn-submit:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .error-msg { 
            background-color: rgba(239, 68, 68, 0.15); 
            border: 1px solid #ef4444; 
            color: #f87171; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            margin-top: 15px; 
            display: none; 
            text-align: center; 
        }
        .success-box {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
            margin-top: 10px;
        }
        #loading-screen {
            text-align: center;
            font-size: 16px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div id="loading-screen">Checking Sticker Status...</div>

    <div id="main-form-wrapper" style="display: none;">
        <h2>AlertoQR Safety</h2>
        <div class="subtitle">Register & Activate Your Smart Sticker</div>

        <form id="registration-form" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label>Sticker Serial ID</label>
                <input type="text" id="sticker_id" required readonly placeholder="Scanning Serial ID...">
            </div>
            <div class="form-group">
                <label>Owner Full Name</label>
                <input type="text" id="full_name" placeholder="Enter owner's full name" required>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobile_number" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
            </div>
            <div class="form-group">
                <label>Vehicle Plate Number</label>
                <input type="text" id="vehicle_number" placeholder="e.g. UP32PD2478" style="text-transform: uppercase;" required>
            </div>
            <div class="form-group">
                <label>Create 4-Digit Secret PIN</label>
                <input type="password" id="secret_pin" placeholder="••••" maxlength="4" pattern="[0-9]{4}" required>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">📝 SUBMIT FOR ACTIVATION</button>
        </form>

        <div class="error-msg" id="error-box"></div>
    </div>

    <div class="success-box" id="success-container">
        <h3 style="margin-top: 0; color: #10b981;">✨ Registration Submitted!</h3>
        <p style="font-size: 14px; color: #cbd5e1;">Your details are saved successfully. Please contact the administrator to activate your card subscription plan.</p>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlStickerId = urlParams.get('id');
        
        if (urlStickerId) {
            const cleanId = urlStickerId.trim().toUpperCase();
            document.getElementById('sticker_id').value = cleanId;

            try {
                // Check if already registered and active in system database
                const { data, error } = await _supabase.from('registrations').select('status').eq('sticker_id', cleanId).maybeSingle();
                
                if(data && data.status === 'Active') {
                    // SEED DIRECT REDIRECTION TO THE HELPER PAGE IF STATUS IS ACTIVE
                    window.location.href = `helper.html?id=${cleanId}`;
                    return;
                }
            } catch (err) {
                console.error("Routing validation error:", err);
            }
        } else {
            document.getElementById('sticker_id').removeAttribute('readonly');
            document.getElementById('sticker_id').placeholder = "Enter Sticker ID Manually";
        }

        // Display Form elements if record status is not active/not found
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('main-form-wrapper').style.display = 'block';
    });

    async function handleRegistration(event) {
        event.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');
        
        errorBox.style.display = 'none';
        submitBtn.innerText = "Saving Details...";
        submitBtn.disabled = true;

        const stickerId = document.getElementById('sticker_id').value.trim().toUpperCase();
        const fullName = document.getElementById('full_name').value.trim();
        const mobileNumber = document.getElementById('mobile_number').value.trim();
        const vehicleNumber = document.getElementById('vehicle_number').value.trim().toUpperCase();
        const secretPin = document.getElementById('secret_pin').value.trim();

        try {
            const { error: insertError } = await _supabase.from('registrations').insert([{ 
                sticker_id: stickerId, 
                full_name: fullName, 
                mobile_number: mobileNumber, 
                vehicle_number: vehicleNumber, 
                secret_pin: secretPin,
                status: 'Pending' 
            }]);

            if (insertError) throw insertError;

            document.getElementById('main-form-wrapper').style.display = 'none';
            document.getElementById('success-container').style.display = 'block';

        } catch (err) {
            errorBox.innerText = "Error: " + err.message;
            errorBox.style.display = 'block';
            submitBtn.innerText = "📝 SUBMIT FOR ACTIVATION";
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
