<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate AlertoQR</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; text-align: center; padding-top: 40px; }
        .box { background: #2a2a2a; padding: 25px; border-radius: 15px; display: inline-block; width: 85%; max-width: 350px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        .btn-reg { background: #007bff; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #ffcc00;">Activate Sticker</h2>
        <p id="stId" style="color: #888;"></p>
        <input type="text" id="cName" placeholder="Enter Full Name">
        <input type="text" id="cMobile" placeholder="Enter Mobile Number">
        <input type="text" id="vNumber" placeholder="Enter Vehicle Number">
        <button class="btn-reg" onclick="register()">ACTIVATE NOW</button>
    </div>

    <script>
        // AAPKA NAYA LINK SET KAR DIYA HAI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxx3RAI6sgGd8aJ4GNhj8qgLRkisaadACHW576jOymmfrTptqQPq77McXGc-9N4seVL/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const stickerId = urlParams.get('id');
        document.getElementById('stId').innerText = "ID: " + (stickerId || "Unknown");

        function register() {
            const name = document.getElementById('cName').value;
            const mobile = document.getElementById('cMobile').value;
            const vNo = document.getElementById('vNumber').value;

            if(!name || !mobile || !vNo) { alert("Please fill all details!"); return; }

            const payload = { id: stickerId, name: name, mobile: mobile, vNo: vNo };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            }).then(() => {
                alert("Sticker Activated Successfully!");
                window.location.href = "index.html?id=" + stickerId;
            }).catch(err => alert("Error: " + err));
        }
    </script>
</body>
</html>
