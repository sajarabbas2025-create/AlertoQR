<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Registration - AlertoQR</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #0056b3; font-size: 28px; margin-bottom: 5px; font-weight: 700; }
        .sticker-label { color: #ff4d4d; font-weight: 600; margin-bottom: 25px; display: block; font-size: 14px; }
        input { width: 100%; padding: 15px; margin: 12px 0; border: 1.5px solid #e1e4e8; border-radius: 12px; box-sizing: border-box; font-size: 16px; background-color: #fcfdfe; transition: 0.3s; }
        input:focus { border-color: #0056b3; outline: none; background-color: #fff; }
        button { width: 100%; padding: 18px; background-color: #1a73e8; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.3s; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3); }
        button:hover { background-color: #1557b0; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        #status-msg { margin-top: 20px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <h2>Vehicle Registration</h2>
    <span class="sticker-label">Sticker ID: <span id="id-tag">Detecting...</span></span>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="v-num" placeholder="Vehicle Number (e.g. UP80...)">
    <input type="tel" id="p-num" placeholder="Mobile Number">
    
    <button id="save-btn" onclick="registerData()">Save Details</button>
    <div id="status-msg"></div>
</div>

<script>
    // 1. Supabase Connection (IMPORTANT: Paste your key below)
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; // Dashboard -> Settings -> API -> anon public key
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. ID Extraction from URL (?id=AGRA001)
    const urlParams = new URLSearchParams(window.location.search);
    const sid = urlParams.get('id');
    if (sid) {
        document.getElementById('id-tag').textContent = sid;
        document.getElementById('id-tag').style.color = "#28a745";
    }

    // 3. Register Function
    async function registerData() {
        const fullName = document.getElementById('name').value;
        const vehicle = document.getElementById('v-num').value;
        const phone = document.getElementById('p-num').value;
        const status = document.getElementById('status-msg');
        const btn = document.getElementById('save-btn');

        if(!fullName || !vehicle || !phone) {
            alert("Please fill all details correctly.");
            return;
        }

        btn.innerText = "Processing...";
        btn.disabled = true;

        const { error } = await supabase
            .from('registrations')
            .insert([{ 
                sticker_id: sid || "NOT_FOUND", 
                full_name: fullName, 
                vehicle_number: vehicle, 
                phone_number: phone 
            }]);

        if (error) {
            status.innerText = "Error: " + error.message;
            status.style.color = "#dc3545";
            btn.innerText = "Save Details";
            btn.disabled = false;
        } else {
            status.innerText = "Registration Successful!";
            status.style.color = "#28a745";
            btn.innerText = "Successfully Saved";
            btn.style.backgroundColor = "#28a745";
        }
    }
</script>
</body>
</html>
