<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AlertoQR - Vehicle Registration</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
        }

        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 14px;
            color: #94a3b8;
        }

        .sticker-badge-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 12px;
        }

        .sticker-id-tag {
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 14px 14px 14px 42px;
            font-size: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            background-color: #0f172a;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .form-control::placeholder {
            color: #475569;
        }

        .btn-submit {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:active {
            background-color: #16a34a;
        }

        .btn-submit:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
            color: #94a3b8;
            font-weight: 600;
        }

        #error-screen {
            display: none;
            color: #f87171;
            text-align: center;
            padding: 40px 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 32px; color: #3b82f6; margin-bottom: 16px;"></i>
        <div>Verifying Smart Sticker Status...</div>
    </div>

    <div id="registration-view" style="display: none !important;">
        
        <div class="header-section">
            <h1 class="header-title">Activate Smart QR</h1>
            <p class="header-subtitle">Fill details to link your vehicle safety sticker</p>
            <div class="sticker-badge-wrapper">
                <span class="sticker-id-tag" id="lbl-sticker-id">ID: ----</span>
            </div>
        </div>

        <form id="form-register">
            <div class="form-group">
                <label for="txt-owner-name">Owner Full Name *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="txt-owner-name" class="form-control" placeholder="Enter full name (e.g. Sajar Abbas)" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-mobile">WhatsApp Mobile Number *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="txt-mobile" class="form-control" placeholder="10 Digit Number" pattern="[0-9]{10}" title="Please enter valid 10 digit number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-alternate">Alternate Number <span style="color: #64748b; font-weight: normal;">(Optional)</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-mobile-button"></i>
                    <input type="tel" id="txt-alternate" class="form-control" placeholder="Backup Contact Number">
                </div>
            </div>

            <div class="form-group">
                <label for="txt-vehicle">Vehicle Number *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-car"></i>
                    <input type="text" id="txt-vehicle" class="form-control" placeholder="e.g. UP16XX1234" style="text-transform: uppercase;" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-chassis">Chassis No. (Last 4 Digits) *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-fingerprint"></i>
                    <input type="text" id="txt-chassis" class="form-control" placeholder="Forgot PIN ke waqt security ke liye" maxlength="4" required>
                </div>
            </div>

            <div class="form-group">
                <label for="txt-pin">Create 4-Digit Security PIN *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="text" id="txt-pin" class="form-control" placeholder="4 Digit Password PIN" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" title="Please enter 4 digit numeric PIN" required>
                </div>
            </div>

            <button type="submit" id="btn-save-action" class="btn-submit">
                <i class="fa-solid fa-circle-check"></i> Complete Activation
            </button>
        </form>

    </div>

    <div id="error-screen">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 36px; margin-bottom: 16px;"></i>
        <div id="error-message-text">Configuration mapping missing.</div>
    </div>

</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let cleanStickerId = "";

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (!urlParams.has('v')) {
            urlParams.set('v', Date.now());
            window.location.search = urlParams.toString();
            return;
        }

        const stickerId = urlParams.get('id');
        if (!stickerId || stickerId.trim() === "") {
            showErrorState("Scan Error: Missing Sticker ID Parameter.");
            return;
        }

        cleanStickerId = stickerId.trim().toUpperCase();
        document.getElementById('lbl-sticker-id').innerText = cleanStickerId;

        try {
            const { data, error } = await _supabase
                .from('registrations')
                .select('status')
                .eq('sticker_id', cleanStickerId)
                .maybeSingle();

            if (error) {
                showErrorState("Database connection failure. Please reload page.");
                return;
            }

            // Agar sticker already active hai to helper page par redirect ho jayega
            if (data && data.status === 'Active') {
                window.location.href = `helper.html?id=${cleanStickerId}`;
                return;
            }

            document.getElementById('loading-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('registration-view').style.setProperty('display', 'block', 'important');

        } catch (err) {
            showErrorState("System configuration failure.");
        }
    });

    document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const ownerName = document.getElementById('txt-owner-name').value.trim();
        const mobileNumber = document.getElementById('txt-mobile').value.trim();
        const alternateNumber = document.getElementById('txt-alternate').value.trim();
        const vehicleNumber = document.getElementById('txt-vehicle').value.trim().toUpperCase();
        const chassisNumber = document.getElementById('txt-chassis').value.trim();
        const secretPin = document.getElementById('txt-pin').value.trim();
        
        if(secretPin.length !== 4) {
            alert("Please input a proper 4-Digit Security PIN before saving.");
            return;
        }

        const btnSave = document.getElementById('btn-save-action');
        btnSave.disabled = true;
        btnSave.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing Activation...';

        try {
            // FIXED: 'full_name' ko badalkar 'owner_name' kiya taki Helper Page ke data binding se match kare
            const { error } = await _supabase
                .from('registrations')
                .upsert({
                    sticker_id: cleanStickerId,
                    owner_name: ownerName, 
                    mobile_number: mobileNumber,
                    alternate_number: alternateNumber || null,
                    vehicle_number: vehicleNumber,
                    chassis_last_4: chassisNumber, 
                    secret_pin: secretPin,
                    status: 'Active'
                }, { onConflict: 'sticker_id' });

            if (error) {
                alert("Database execution error: " + error.message);
                btnSave.disabled = false;
                btnSave.innerHTML = '<i class="fa-solid fa-circle-check"></i> Complete Activation';
                return;
            }

            alert("🎉 Your Smart AlertoQR Sticker is Now Live and Active!");
            window.location.href = `helper.html?id=${cleanStickerId}`;

        } catch (err) {
            alert("Network timeout error. Check data bandwidth.");
            btnSave.disabled = false;
            btnSave.innerHTML = '<i class="fa-solid fa-circle-check"></i> Complete Activation';
        }
    });

    function showErrorState(msg) {
        document.getElementById('loading-screen').style.setProperty('display', 'none', 'important');
        document.getElementById('error-message-text').innerText = msg;
        document.getElementById('error-screen').style.setProperty('display', 'block', 'important');
    }
</script>
</body>
</html>
