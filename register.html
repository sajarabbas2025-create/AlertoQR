<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Activate Vehicle Safety Sticker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 30px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            box-sizing: border-box; 
            text-align: center; 
        }
        h2 { 
            margin-top: 0; 
            color: #38bdf8; 
            font-size: 24px; 
            margin-bottom: 5px; 
            font-weight: 700; 
        }
        .tagline { 
            color: #94a3b8; 
            font-size: 13px; 
            margin-bottom: 25px; 
            font-weight: 500;
        }
        
        .form-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }
        label { 
            display: block; 
            font-size: 11px; 
            color: #94a3b8; 
            margin-bottom: 6px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            background: #0f172a; 
            border: 1px solid #475569; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 14px; 
            box-sizing: border-box; 
            transition: 0.2s;
        }
        input:focus { 
            border-color: #38bdf8; 
            outline: none; 
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        input:disabled { 
            background: #1e293b; 
            color: #64748b; 
            border-color: #334155; 
            cursor: not-allowed; 
            font-weight: bold;
        }
        
        .payment-box { 
            background: rgba(15, 23, 42, 0.8); 
            border: 2px dashed #10b981; 
            border-radius: 10px; 
            padding: 20px; 
            margin-top: 25px; 
            display: none; 
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .price { 
            font-size: 32px; 
            font-weight: 800; 
            color: #10b981; 
            margin: 10px 0; 
        }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            transition: 0.2s; 
        }
        .btn-primary { 
            background: #2563eb; 
            color: #fff; 
            margin-top: 15px; 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn-primary:hover { 
            background: #1d4ed8; 
        }
        .btn-success { 
            background: #10b981; 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); 
        }
        .btn-success:hover { 
            background: #059669; 
        }
        
        .status-msg { 
            text-align: center; 
            font-size: 13px; 
            margin-top: 15px; 
            font-weight: 600; 
            padding: 10px;
            border-radius: 6px;
            display: none; 
        }
        .status-success { 
            background: rgba(16, 185, 129, 0.15);
            color: #10b981; 
            border: 1px solid #10b981;
        }
        .status-error { 
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444; 
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>AlertoQR Safety</h2>
    <div class="tagline">Register & Activate Your Smart Sticker</div>

    <form id="registrationForm" onsubmit="submitCustomerDataFirst(event)">
        <div class="form-group">
            <label>Sticker Serial ID</label>
            <input type="text" id="sticker_id" disabled>
        </div>

        <div class="form-group">
            <label>Owner Full Name</label>
            <input type="text" id="full_name" placeholder="Enter vehicle owner's name" required>
        </div>

        <div class="form-group">
            <label>Mobile Number (For Emergency Alerts)</label>
            <input type="tel" id="mobile_number" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label>Vehicle Plate Number</label>
            <input type="text" id="vehicle_number" placeholder="e.g. UP80CC8090" required style="text-transform: uppercase;">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">📝 Submit Details</button>
    </form>

    <div class="payment-box" id="payment-area">
        <div style="font-size: 12px; color: #eab308; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Details Saved To System!</div>
        <div class="price">₹299.00</div>
        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 18px; line-height: 1.4;">Click below to pay online for instant automatic activation.</div>
        
        <button onclick="handleInstantAutoActivationPay()" class="btn btn-success">📱 Pay via UPI & Activate Now</button>
        
        <div style="font-size: 11px; color: #94a3b8; margin-top: 18px; font-style: italic; line-height: 1.4; border-top: 1px dashed #334155; padding-top: 12px;">
            💡 <b>Cash Payment Customer?</b><br>If you are paying via Cash/Offline, you can close this page now. Admin will verify and activate it from the control panel.
        </div>
    </div>

    <div id="status-display-node" class="status-msg"></div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let parsedStickerID = "";

    function extractStickerContext() {
        const urlParams = new URLSearchParams(window.location.search);
        parsedStickerID = urlParams.get('id');

        if (!parsedStickerID) {
            renderSystemMessage("⚠️ Error: Missing Sticker ID parameter.", true);
            document.getElementById('submit-btn').disabled = true;
            return;
        }

        parsedStickerID = parsedStickerID.trim().toUpperCase();
        document.getElementById('sticker_id').value = parsedStickerID;
        checkIfStickerAlreadyRegistered();
    }

    // Full Domain URL redirection to avoid any local path errors
    async function checkIfStickerAlreadyRegistered() {
        let { data, error } = await _supabaseClient
            .from('registrations')
            .select('status')
            .eq('sticker_id', parsedStickerID)
            .maybeSingle();

        if (data && data.status === 'Active') {
            window.location.replace(`https://alertoqr.in/helper.html?id=${parsedStickerID}`);
        }
    }

    async function submitCustomerDataFirst(event) {
        event.preventDefault();
        
        const name = document.getElementById('full_name').value.trim();
        const mobile = document.getElementById('mobile_number').value.trim();
        const vehicle = document.getElementById('vehicle_number').value.trim().toUpperCase();

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').innerText = "⏳ Saving Details...";

        const customerPayload = {
            sticker_id: parsedStickerID,
            full_name: name,
            mobile: mobile,
            vehicle_number: vehicle,
            status: 'Pending',
            created_at: new Date().toISOString()
        };

        const { error } = await _supabaseClient
            .from('registrations')
            .upsert(customerPayload, { onConflict: 'sticker_id' });

        if (error) {
            console.error("Database Write Error:", error);
            renderSystemMessage(`❌ Error saving details: ${error.message}`, true);
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('submit-btn').innerText = "📝 Submit Details";
        } else {
            document.getElementById('full_name').disabled = true;
            document.getElementById('mobile_number').disabled = true;
            document.getElementById('vehicle_number').disabled = true;
            document.getElementById('submit-btn').style.display = 'none';

            document.getElementById('payment-area').style.display = 'block';
            renderSystemMessage("🎯 Details recorded successfully in Admin Panel!", false);
        }
    }

    function handleInstantAutoActivationPay() {
        renderSystemMessage("🔄 Launching payment app...", false);

        const upiMerchantId = "9808447814@ybl"; 
        const merchantName = "AlertoQR Safety Systems";
        const transactionNote = encodeURIComponent(`Instant Activation for sticker ${parsedStickerID}`);
        
        const upiGatewayDeepLink = `upi://pay?pa=${upiMerchantId}&pn=${encodeURIComponent(merchantName)}&am=299.00&cu=INR&tn=${transactionNote}`;

        window.location.href = upiGatewayDeepLink;

        setTimeout(async () => {
            renderSystemMessage("⚡ Processing automatic activation...", false);

            let calculatedDateObj = new Date();
            calculatedDateObj.setFullYear(calculatedDateObj.getFullYear() + 1);
            const transformedExpiryDateString = calculatedDateObj.toISOString().split('T')[0];

            const { error } = await _supabaseClient
                .from('registrations')
                .update({ 
                    status: 'Active',
                    expiry_date: transformedExpiryDateString
                })
                .eq('sticker_id', parsedStickerID);

            if (!error) {
                renderSystemMessage("🎉 Sticker activated automatically!", false);
                alert("⚡ Thank you! Your sticker is now fully Active for 1 Year.");
                window.location.replace(`https://alertoqr.in/helper.html?id=${parsedStickerID}`);
            } else {
                renderSystemMessage("⚠️ Activation logged. Admin will cross-verify manually if needed.", true);
            }
        }, 6000);
    }

    function renderSystemMessage(messageText, isErrorState) {
        const messageBox = document.getElementById('status-display-node');
        messageBox.innerText = messageText;
        messageBox.style.display = "block";
        messageBox.className = isErrorState ? "status-msg status-error" : "status-msg status-success";
    }

    extractStickerContext();
</script>
</body>
</html>
