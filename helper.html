<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AlertoQR Helper Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #0f172a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; }

        .helper-container { width: 100%; max-width: 480px; background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .brand-name { font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        .sticker-id-badge { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #475569; border: 1px solid #e2e8f0; }
        
        .owner-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .meta-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        .vehicle-number-plate { background: #000000; color: #ffffff; display: inline-block; padding: 8px 20px; border-radius: 8px; font-size: 20px; font-weight: 800; letter-spacing: 1.5px; }
        
        .calling-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .btn-call { padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-owner { background: #000000; color: white; }
        .btn-alternate { background: #ffffff; color: #000000; border: 1px solid #cbd5e1; }

        .section-title { font-size: 12px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; }

        .alerts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .alert-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px 16px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .alert-card i { font-size: 26px; }
        .alert-card span { font-size: 13px; font-weight: 700; color: #334155; }
        
        .btn-sos-heavy { background: #ff3b30; color: white; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(255, 59, 48, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px; }

        .emergency-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-emergency { padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-police { background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
        .btn-ambulance { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }

        .state-shell-view { text-align: center; padding: 40px 10px; }
        .spinner-engine { width: 40px; height: 40px; border: 3px solid #f1f5f9; border-top: 3px solid #000000; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="helper-container">
    
    <div id="loading-view" class="state-shell-view">
        <div class="spinner-engine"></div>
        <p id="loading-text" style="color: #64748b; font-size: 14px; font-weight: 500;">Connecting secure network...</p>
    </div>

    <div id="error-view" class="state-shell-view" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #ef4444; margin-bottom: 12px;"></i>
        <h3 id="error-heading" style="font-size: 16px; margin-bottom: 6px;">Network Fault</h3>
        <p id="error-subtext" style="color: #64748b; font-size: 13px;"></p>
    </div>

    <div id="dashboard-view" style="display: none;">
        <div class="header-section">
            <div class="brand-name">AlertoQR</div>
            <div class="sticker-id-badge" id="dom-sticker-badge">ID: ----</div>
        </div>

        <div class="owner-card">
            <div class="meta-label">AlertoQR Registered Vehicle</div>
            <div class="vehicle-number-plate" id="dom-plate-number">------</div>
        </div>

        <div class="calling-grid">
            <button id="btn-call-owner" class="btn-call btn-owner">
                <i class="fa-solid fa-phone"></i> Call Owner
            </button>
            <button id="btn-call-alt" class="btn-call btn-alternate">
                <i class="fa-solid fa-phone"></i> Call Alternate
            </button>
        </div>

        <div class="section-title">Quick Alerts</div>
        
        <div class="alerts-grid">
            <div id="card-parking" class="alert-card">
                <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
                <span>Wrong Parking</span>
            </div>
            <div id="card-tow" class="alert-card">
                <i class="fa-solid fa-car" style="color: #3b82f6;"></i>
                <span>Tow Alert</span>
            </div>
            <div id="card-window" class="alert-card">
                <i class="fa-solid fa-file-invoice" style="color: #000000;"></i>
                <span>Window Open</span>
            </div>
            <div id="card-photo" class="alert-card">
                <i class="fa-solid fa-camera" style="color: #64748b;"></i>
                <span>Share Photo</span>
            </div>
        </div>

        <button id="btn-sos-action" class="btn-sos-heavy">
            🚨 EMERGENCY SOS
        </button>

        <div class="emergency-grid">
            <button class="btn-emergency btn-police" onclick="window.location.href='tel:112'">
                <i class="fa-solid fa-building-shield"></i> Call Police
            </button>
            <button class="btn-emergency btn-ambulance" onclick="window.location.href='tel:108'">
                <i class="fa-solid fa-truck-medical"></i> Ambulance
            </button>
        </div>
        
        <div style="text-align: center; margin-top: 25px;">
            <a href="update.html" style="color: #64748b; font-size: 12px; font-weight: 600; text-decoration: none;">Are you the Owner? <span style="color: #3b82f6;">Update Profile</span></a>
        </div>
    </div>
</div>

<script>
    const databaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const databaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(databaseUrl, databaseKey);

    let urlAssetId = "";
    let globalOwnerMobile = "";

    window.addEventListener('DOMContentLoaded', async () => {
        const queryStrings = new URLSearchParams(window.location.search);
        
        if (!queryStrings.has('v')) {
            queryStrings.set('v', Date.now());
            window.location.search = queryStrings.toString();
            return;
        }
        
        urlAssetId = queryStrings.get('id') || queryStrings.get('ic');
        if (!urlAssetId) {
            deployErrorView('Invalid QR Code', 'This QR code is incomplete or damaged.');
            return;
        }
        
        urlAssetId = urlAssetId.replace('@', '').trim().toUpperCase();
        document.getElementById('dom-sticker-badge').innerText = `ID: ${urlAssetId}`;

        try {
            const { data, error } = await _supabase.from('registrations').select('*').eq('sticker_id', urlAssetId).single();
            
            // SMART ROUTING LOGIC: Agar record nahi mila, toh seedha Register page par bhej do!
            if (error || !data) { 
                document.getElementById('loading-text').innerText = "New QR Detected! Redirecting to Registration...";
                setTimeout(() => {
                    window.location.href = `register.html?id=${urlAssetId}`;
                }, 800);
                return; 
            }
            
            document.getElementById('dom-plate-number').innerText = data.vehicle_number || "VEHICLE";

            // Primary Mobile Setup
            let mobileNum = data.mobile_number ? data.mobile_number.toString().replace(/[^0-9]/g, '') : "";
            if(mobileNum.startsWith('0')) mobileNum = mobileNum.substring(1);
            if(mobileNum.length === 10) mobileNum = "91" + mobileNum;

            if (mobileNum) {
                globalOwnerMobile = mobileNum; 
                document.getElementById('btn-call-owner').onclick = () => window.location.href = `tel:+${mobileNum}`;
                
                const waBase = `https://wa.me/${mobileNum}?text=`;
                document.getElementById('card-parking').onclick = () => window.location.href = waBase + encodeURIComponent("Alert! Aapki gaadi galat jagah park hai, kripya ise hatayein.");
                document.getElementById('card-tow').onclick = () => window.location.href = waBase + encodeURIComponent("Alert! Aapki gaadi Tow hone wali hai, jaldi aaiye.");
                document.getElementById('card-window').onclick = () => window.location.href = waBase + encodeURIComponent("Alert! Aapki gaadi ka window/door khula hai, kripya check karein.");
                document.getElementById('card-photo').onclick = () => window.location.href = waBase + encodeURIComponent("Emergency! Main aapki gaadi ke paas hu, aapko photo bhej raha hu.");
            } else {
                deployErrorView('Contact Error', 'Gaadi malik ka number update nahi hai.');
                return;
            }

            // Alternate Mobile Setup
            let altNum = data.alternate_number ? data.alternate_number.toString().replace(/[^0-9]/g, '') : "";
            if(altNum.startsWith('0')) altNum = altNum.substring(1);
            if(altNum.length === 10) altNum = "91" + altNum;

            if (altNum) {
                document.getElementById('btn-call-alt').onclick = () => window.location.href = `tel:+${altNum}`;
            } else {
                document.getElementById('btn-call-alt').onclick = () => alert("Owner ne Alternate Number set nahi kiya hai.");
            }

            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            
        } catch (err) {
            deployErrorView('Network Error', 'Server connection timeout. Please scan again.');
        }
    });

    // --- LIVE GPS LOCATION SOS LOGIC ---
    document.getElementById('btn-sos-action').addEventListener('click', function() {
        if (!globalOwnerMobile) return;

        const btn = this;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GPS Location nikal raha hai...';
        btn.style.opacity = '0.8';

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
                    const sosMessage = `🚨 *EMERGENCY SOS!* 🚨\nAapki gaadi ke paas ek badi emergency hai. Main gaadi ke paas khada hu, kripya turant is location par pahunchein:\n📍 Map Link: ${mapUrl}`;
                    
                    window.location.href = `https://wa.me/${globalOwnerMobile}?text=${encodeURIComponent(sosMessage)}`;
                    setTimeout(() => { btn.innerHTML = originalHtml; btn.style.opacity = '1'; }, 2000);
                },
                function(error) {
                    const fallbackMsg = `🚨 *EMERGENCY SOS!* 🚨\nAapki gaadi ke paas ek badi emergency hai, kripya turant check karein! (Location link failed)`;
                    window.location.href = `https://wa.me/${globalOwnerMobile}?text=${encodeURIComponent(fallbackMsg)}`;
                    setTimeout(() => { btn.innerHTML = originalHtml; btn.style.opacity = '1'; }, 2000);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            const fallbackMsg = `🚨 *EMERGENCY SOS!* 🚨\nAapki gaadi ke paas ek badi emergency hai, kripya turant check karein!`;
            window.location.href = `https://wa.me/${globalOwnerMobile}?text=${encodeURIComponent(fallbackMsg)}`;
            btn.innerHTML = originalHtml;
            btn.style.opacity = '1';
        }
    });

    function deployErrorView(title, message) {
        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('error-heading').innerText = title;
        document.getElementById('error-subtext').innerText = message;
        document.getElementById('error-view').style.display = 'block';
    }
</script>
</body>
</html>
