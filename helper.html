<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR Helper | Vehicle Contact Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f8fafc; 
            color: #1e293b; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .container { 
            width: 100%; 
            max-width: 430px; 
            background: #fff; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            padding: 20px; 
            box-sizing: border-box; 
            text-align: center; 
            margin-top: 10px; 
        }
        .header-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #f1f5f9; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        .brand { 
            font-size: 22px; 
            font-weight: 800; 
            color: #0f172a; 
        }
        .chip { 
            background: #e0f2fe; 
            color: #0284c7; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700; 
        }
        .owner-card { 
            background: #f1f5f9; 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px; 
        }
        .label { 
            font-size: 11px; 
            color: #64748b; 
            text-transform: uppercase; 
            font-weight: 600; 
            letter-spacing: 0.5px; 
        }
        .owner-name { 
            font-size: 24px; 
            font-weight: 700; 
            color: #0f172a; 
            margin: 4px 0 10px 0; 
        }
        .plate-number { 
            background: #000; 
            color: #fff; 
            display: inline-block; 
            padding: 6px 16px; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: 700; 
            letter-spacing: 1px; 
        }
        .call-buttons { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 25px; 
        }
        .btn-call { 
            flex: 1; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            text-decoration: none; 
        }
        .btn-main { 
            background: #000; 
            color: #fff; 
        }
        .btn-alt { 
            background: #fff; 
            color: #1e293b; 
            border: 1px solid #cbd5e1; 
        }
        .alerts-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        .alert-box { 
            background: #fff; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 15px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            text-align: center; 
            transition: 0.2s; 
        }
        .alert-box:hover { 
            background: #f8fafc; 
            border-color: #94a3b8; 
        }
        .alert-box span { 
            display: block; 
            font-size: 24px; 
            margin-bottom: 6px; 
        }
        .edit-trigger { 
            color: #64748b; 
            font-size: 13px; 
            text-decoration: underline; 
            cursor: pointer; 
            margin-top: 15px; 
            display: inline-block; 
        }
        
        /* Modal Popup Styling */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            padding: 15px; 
            box-sizing: border-box; 
        }
        .modal-content { 
            background: #fff; 
            padding: 25px; 
            border-radius: 14px; 
            width: 100%; 
            max-width: 380px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            position: relative; 
            text-align: left; 
        }
        .modal-title { 
            font-size: 18px; 
            font-weight: 700; 
            color: #0f172a; 
            margin-bottom: 15px; 
        }
        .form-group { 
            margin-bottom: 12px; 
        }
        .form-group label { 
            display: block; 
            font-size: 11px; 
            font-weight: 600; 
            margin-bottom: 4px; 
            color: #64748b; 
        }
        .form-group input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 14px; 
            box-sizing: border-box; 
        }
        .modal-actions { 
            display: flex; 
            gap: 10px; 
            margin-top: 18px; 
        }
        .btn-action { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 13px; 
            text-align: center; 
        }
        .btn-save { 
            background: #2563eb; 
            color: #fff; 
        }
        .btn-cancel { 
            background: #e2e8f0; 
            color: #475569; 
        }
        .error-text { 
            color: #ef4444; 
            font-size: 12px; 
            font-weight: 600; 
            margin-top: 5px; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <div class="brand">AlertoQR Helper</div>
        <div class="chip" id="sticker-id-chip">ID: LOADING</div>
    </div>

    <div class="owner-card">
        <div class="label">Vehicle Owner</div>
        <div class="owner-name" id="display-name">Loading...</div>
        <div class="plate-number" id="display-vehicle">------</div>
    </div>

    <div class="call-buttons">
        <a href="#" id="call-owner-btn" class="btn-call btn-main">📞 Call Owner</a>
        <a href="#" id="call-alt-btn" class="btn-call btn-alt">📞 Call Alternate</a>
    </div>

    <div style="text-align: left; font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 10px;">Quick Alerts</div>
    <div class="alerts-grid">
        <div class="alert-box" onclick="sendQuickAlert('Wrong Parking')"><span>⚠️</span>Wrong Parking</div>
        <div class="alert-box" onclick="sendQuickAlert('Tow Alert')"><span>🚛</span>Tow Alert</div>
        <div class="alert-box" onclick="sendQuickAlert('Lights/Door Open')"><span>🚗</span>Lights/Door Open</div>
        <div class="alert-box" onclick="sendQuickAlert('Emergency')"><span>🚑</span>Emergency Help</div>
    </div>

    <span class="edit-trigger" onclick="openLoginModal()">Are you the Owner? Login to Edit</span>
</div>

<div class="modal" id="loginModal">
    <div class="modal-content">
        <div class="modal-title">🔐 Owner Verification</div>
        <div class="form-group">
            <label>Registered Mobile Number</label>
            <input type="tel" id="verify_mobile" placeholder="Enter 10-digit number">
        </div>
        <div class="form-group">
            <label>Secret PIN</label>
            <input type="password" id="verify_pin" placeholder="Enter 4-digit PIN" maxlength="4">
        </div>
        <div class="error-text" id="login-error">❌ Invalid Mobile Number or PIN!</div>
        <div class="modal-actions">
            <button class="btn-action btn-cancel" onclick="closeModal('loginModal')">Cancel</button>
            <button class="btn-action btn-save" onclick="verifyOwnerLogin()">Verify & Login</button>
        </div>
    </div>
</div>

<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-title">✏️ Edit Vehicle Details</div>
        <div class="form-group">
            <label>Owner Full Name</label>
            <input type="text" id="edit_name">
        </div>
        <div class="form-group">
            <label>Alert Mobile Number</label>
            <input type="tel" id="edit_mobile">
        </div>
        <div class="form-group">
            <label>Vehicle Plate Number</label>
            <input type="text" id="edit_vehicle" style="text-transform: uppercase;">
        </div>
        <div class="modal-actions">
            <button class="btn-action btn-cancel" onclick="closeModal('editModal')">Cancel</button>
            <button class="btn-action btn-save" onclick="saveUpdatedDetails()">💾 Save Changes</button>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let currentStickerID = "";
    let dbRecordData = null;

    function init() {
        const urlParams = new URLSearchParams(window.location.search);
        currentStickerID = urlParams.get('id');
        if(!currentStickerID) {
            alert("Sticker ID is missing!"); return;
        }
        currentStickerID = currentStickerID.trim().toUpperCase();
        document.getElementById('sticker-id-chip').innerText = "ID: " + currentStickerID;
        fetchStickerDetails();
    }

    async function fetchStickerDetails() {
        let { data, error } = await _supabaseClient.from('registrations').select('*').eq('sticker_id', currentStickerID).maybeSingle();
        if(data) {
            dbRecordData = data;
            document.getElementById('display-name').innerText = data.full_name;
            document.getElementById('display-vehicle').innerText = data.vehicle_number;
            document.getElementById('call-owner-btn').href = "tel:" + data.mobile;
            document.getElementById('call-alt-btn').href = "tel:" + data.mobile;
        } else {
            document.getElementById('display-name').innerText = "Not Registered";
        }
    }

    function openLoginModal() { 
        document.getElementById('verify_mobile').value = "";
        document.getElementById('verify_pin').value = "";
        document.getElementById('login-error').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex'; 
    }
    
    function closeModal(id) { 
        document.getElementById(id).style.display = 'none'; 
    }

    function verifyOwnerLogin() {
        const inputMobile = document.getElementById('verify_mobile').value.trim();
        const inputPin = document.getElementById('verify_pin').value.trim();
        const errNode = document.getElementById('login-error');

        if(dbRecordData && dbRecordData.mobile === inputMobile && String(dbRecordData.secret_pin) === inputPin) {
            errNode.style.display = 'none';
            document.getElementById('loginModal').style.display = 'none';
            
            document.getElementById('edit_name').value = dbRecordData.full_name;
            document.getElementById('edit_mobile').value = dbRecordData.mobile;
            document.getElementById('edit_vehicle').value = dbRecordData.vehicle_number;
            
            document.getElementById('editModal').style.display = 'flex';
        } else {
            errNode.style.display = 'block';
        }
    }

    async function saveUpdatedDetails() {
        const updatedName = document.getElementById('edit_name').value.trim();
        const updatedMobile = document.getElementById('edit_mobile').value.trim();
        const updatedVehicle = document.getElementById('edit_vehicle').value.trim().toUpperCase();

        if(!updatedName || !updatedMobile || !updatedVehicle) {
            alert("All fields are required!"); return;
        }

        const { error } = await _supabaseClient
            .from('registrations')
            .update({
                full_name: updatedName,
                mobile: updatedMobile,
                vehicle_number: updatedVehicle
            })
            .eq('sticker_id', currentStickerID);

        if(!error) {
            alert("🎉 Profile updated successfully!");
            document.getElementById('editModal').style.display = 'none';
            fetchStickerDetails();
        } else {
            alert("❌ Update failed: " + error.message);
        }
    }

    function sendQuickAlert(type) {
        alert("📲 Notification Sent to Owner: " + type + " for vehicle " + document.getElementById('display-vehicle').innerText);
    }

    init();
</script>
</body>
</html>
