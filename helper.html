<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>AlertoQR Helper Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #0f172a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; }
        .helper-container { width: 100%; max-width: 480px; background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .brand-name { font-size: 22px; font-weight: 800; color: #0f172a; }
        .owner-card { background: #000000; color: #ffffff; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .owner-name { font-size: 24px; font-weight: 800; color: #ffffff; margin-bottom: 8px; text-transform: uppercase; }
        .vehicle-number-plate { background: #ffffff; color: #000000; display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 18px; font-weight: 800; letter-spacing: 1px; }
        .calling-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
        .btn-call { padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; background: #22c55e; color: white; }
        .alerts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .alert-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

<div class="helper-container">
    <div id="dashboard-view">
        <div class="header-section">
            <div class="brand-name">AlertoQR</div>
        </div>

        <div class="owner-card">
            <div class="owner-name" id="dom-owner-name">Loading...</div>
            <div class="vehicle-number-plate" id="dom-plate-number">----</div>
        </div>

        <div class="calling-grid">
            <button class="btn-call" onclick="initiateDirectCall()">
                <i class="fa-solid fa-phone"></i> CALL OWNER NOW
            </button>
        </div>

        <div class="alerts-grid">
            <div class="alert-card" onclick="sendAlert('Wrong Parking')"><i class="fa-solid fa-triangle-exclamation"></i><br><span>Wrong Parking</span></div>
            <div class="alert-card" onclick="sendAlert('Tow Alert')"><i class="fa-solid fa-car"></i><br><span>Tow Alert</span></div>
        </div>
    </div>
</div>

<script>
    const VIRTUAL_NUMBER = "918634512424"; // SMSCountry Virtual Number
    const _supabase = supabase.createClient('https://cefzsgchfdvtyfmcrsda.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs');
    let urlAssetId = new URLSearchParams(window.location.search).get('id') || "";

    window.onload = async () => {
        const { data } = await _supabase.from('registrations').select('*').eq('sticker_id', urlAssetId.toUpperCase()).single();
        if(data) {
            document.getElementById('dom-owner-name').innerText = data.full_name;
            document.getElementById('dom-plate-number').innerText = data.vehicle_number;
        }
    };

    // DIRECT CALL FUNCTION (No Modal)
    function initiateDirectCall() {
        // Backend ko signal bhejo
        fetch('https://alerto-qr.vercel.app/api/prepare-call', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ stickerId: urlAssetId })
        });
        
        // Dialpad kholo
        window.location.href = `tel:${VIRTUAL_NUMBER}`;
    }

    function sendAlert(msg) {
        fetch('https://alerto-qr.vercel.app/api/send-alert', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ stickerId: urlAssetId, alertType: msg, mode: 'sms' })
        }).then(() => alert("Notification sent!"));
    }
</script>
</body>
</html>
