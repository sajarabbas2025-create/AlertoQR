<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #fff; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; font-size: 12px; color: #888; }
        .owner-box { background: #f9f9f9; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
        .owner-label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; }
        .owner-name { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .v-plate { display: inline-block; background: #000; color: #fff; padding: 5px 10px; font-weight: bold; font-size: 14px; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .btn-black { background: #000; color: #fff; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; border-radius: 4px; }
        .btn-white { background: #fff; color: #000; border: 1px solid #ddd; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; border-radius: 4px; }
        
        .quick-alerts { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .alert-card { border: 1px solid #eee; padding: 20px; border-radius: 4px; text-align: left; font-size: 13px; font-weight: bold; color: #333; }
        .alert-icon { font-size: 20px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <div class="header">
        <b>AlertoQR Helper</b>
        <span>ID: AGRA001</span>
    </div>
    
    <div class="owner-box">
        <div class="owner-label">Vehicle Owner</div>
        <div class="owner-name" id="owner_name">Akash</div>
        <div class="v-plate" id="v_num">UP14AB1234</div>
    </div>

    <div class="action-btns">
        <a href="tel:9912345678" class="btn-black">📞 Call Owner</a>
        <a href="#" class="btn-white">📞 Call Alternate</a>
    </div>

    <div class="owner-label" style="margin-bottom: 15px;">Quick Alerts</div>
    <div class="quick-alerts">
        <div class="alert-card"><span class="alert-icon">⚠️</span> Wrong Parking</div>
        <div class="alert-card"><span class="alert-icon">🚚</span> Tow Alert</div>
        <div class="alert-card"><span class="alert-icon">🪟</span> Open Window</div>
        <div class="alert-card"><span class="alert-icon">📍</span> Share Location</div>
    </div>
</body>
</html>
