<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR - Helper</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f1f4f9; 
            margin: 0; 
            padding: 20px 10px; 
            display: flex; 
            justify-content: center;
        }
        .app-container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 24px; 
            padding: 24px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); 
        }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 22px; font-weight: 800; color: #0f172a; margin: 0; }
        .badge { background: #f8fafc; color: #64748b; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; border: 1px solid #e2e8f0; }
        .divider { height: 1px; background: #f1f5f9; margin-bottom: 24px; width: 100%; }
        
        /* Owner Card */
        .owner-card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; margin-bottom: 24px; }
        .label { font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .owner-name { font-size: 24px; font-weight: 800; margin: 4px 0 12px 0; color: #1e293b; }
        .plate { background: #000; color: #fff; display: inline-block; padding: 6px 16px; border-radius: 6px; font-weight: 700; font-size: 14px; letter-spacing: 1px; }
        
        /* Action Buttons (Main Page) */
        .action-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-black { background: #000; color: #fff; }
        .btn-white { background: #fff; color: #000; border: 1px solid #e2e8f0; }
        .btn-red { background: #dc2626; color: #fff; width: 100%; margin-bottom: 32px; }
        
        /* Quick Alerts Grid */
        .section-title { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-item { border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; background: #fff; transition: background 0.2s; }
        .grid-item:active { background: #f8fafc; }
        .grid-text { font-size: 13px; font-weight: 700; color: #475569; }
        
        /* Icons */
        .icon { width: 24px; height: 24px; }
        .icon-red { fill: #dc2626; }
        .icon-blue { fill: #3b82f6; }
        .icon-gray { fill: #475569; }
        .icon-white { fill: #ffffff; }
        .icon-black { fill: #000000; }

        /* --- MODAL (POPUP) STYLES --- */
        .modal-overlay {
            display: none; /* Default hidden */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 1000; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #fff; width: 100%; max-width: 340px;
            border-radius: 20px; padding: 24px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-top: 0; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .modal-input {
            width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 12px;
            font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 16px;
            box-sizing: border-box; outline: none; transition: border-color 0.2s;
        }
        .modal-input:focus { border-color: #0f172a; }
        .modal-btn {
            width: 100%; padding: 14px; background: #000; color: #fff;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; margin-bottom: 12px;
        }
        .modal-btn-cancel {
            width: 100%; padding: 10px; background: transparent; color: #64748b;
            border: none; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        #modalMessage { font-size: 14px; font-weight: 600; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1 class="logo">AlertoQR</h1>
        <div class="badge">ID: ALQR1003</div>
    </div>
    <div class="divider"></div>

    <div class="owner-card">
        <div class="label">Vehicle Owner</div>
        <div class="owner-name">GAURAV</div>
        <div class="plate">UP80C08090</div>
    </div>

    <div class="action-row">
        <button class="btn btn-black" onclick="openModal('Owner')">
            <svg class="icon icon-white" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
            Call Owner
        </button>
        <button class="btn btn-white" onclick="openModal('Alt')">
            <svg class="icon icon-black" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
            Call Alt
        </button>
    </div>

    <button class="btn btn-red">
        <svg class="icon icon-white" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        EMERGENCY SOS
    </button>

    <div class="section-title">Quick Alerts</div>
    <div class="grid">
        <div class="grid-item">
            <svg class="icon icon-red" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
            <span class="grid-text">Wrong Parking</span>
        </div>
        <div class="grid-item">
            <svg class="icon icon-blue" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
            <span class="grid-text">Tow Alert</span>
        </div>
        <div class="grid-item">
            <svg class="icon icon-gray" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 15h10v2H7z"/></svg>
            <span class="grid-text">Window Open</span>
        </div>
        <div class="grid-item">
            <svg class="icon icon-gray" viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/></svg>
            <span class="grid-text">Share Photo</span>
        </div>
    </div>
</div>

<div id="callModal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-title" id="modalTitle">Connect Call</h3>
        <p class="modal-desc">Your number will remain private and secure.</p>
        
        <input type="hidden" id="vehiclePin" value="1001">
        
        <input type="tel" id="helperNumber" class="modal-input" placeholder="Enter your mobile number" maxlength="10">
        
        <button class="modal-btn" id="submitBtn" onclick="submitCall()">Connect Now</button>
        
        <button class="modal-btn-cancel" id="cancelBtn" onclick="closeModal()">Cancel</button>
        
        <div id="modalMessage"></div>
    </div>
</div>

<script>
    // Popup Kholne ka function
    function openModal(callType) {
        document.getElementById('callModal').style.display = 'flex';
        document.getElementById('modalMessage').style.display = 'none';
        document.getElementById('helperNumber').value = '';
        document.getElementById('helperNumber').style.display = 'block';
        document.getElementById('submitBtn').style.display = 'block';
        document.getElementById('cancelBtn').innerText = 'Cancel';
        
        if(callType === 'Owner') {
            document.getElementById('modalTitle').innerText = 'Call Vehicle Owner';
        } else {
            document.getElementById('modalTitle').innerText = 'Call Alternate Number';
        }
    }

    // Popup Band karne ka function
    function closeModal() {
        document.getElementById('callModal').style.display = 'none';
    }

    // Call Submit karne ka function
    async function submitCall() {
        const helperNumber = document.getElementById('helperNumber').value;
        const vehiclePin = document.getElementById('vehiclePin').value;
        const msgBox = document.getElementById('modalMessage');
        const submitBtn = document.getElementById('submitBtn');
        const helperInput = document.getElementById('helperNumber');

        msgBox.style.display = 'block';

        if(helperNumber.length !== 10) {
            msgBox.style.color = "#dc2626"; // Red
            msgBox.innerText = "Please enter a valid 10-digit number.";
            return;
        }

        msgBox.style.color = "#3b82f6"; // Blue
        msgBox.innerText = "Connecting... Please wait.";
        submitBtn.disabled = true;

        try {
            // YAHAN AAPKA VERCEL LINK PEHLE SE DAAL DIYA HAI
            const response = await fetch('https://alerto-qr.vercel.app/api/send-alert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ vehiclePin, helperNumber })
            });

            const data = await response.json();
            
            if(data.success) {
                // Success hone par dabba aur button hide ho jayega aur final message aayega
                helperInput.style.display = 'none';
                submitBtn.style.display = 'none';
                document.getElementById('cancelBtn').innerText = 'Close';
                
                msgBox.style.color = "#059669"; // Green
                msgBox.innerText = "You will receive a call shortly. Please pick it up!";
            } else {
                msgBox.style.color = "#dc2626"; // Red
                msgBox.innerText = "Error: " + data.message;
                submitBtn.disabled = false;
            }
        } catch (error) {
            msgBox.style.color = "#dc2626"; // Red
            msgBox.innerText = "Server error. Please try again later.";
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
