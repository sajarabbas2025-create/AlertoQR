<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR - Vehicle Alert</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 text-center">
        
        <h1 class="text-2xl font-bold text-gray-800 mb-1">AlertoQR</h1>
        <p class="text-gray-500 text-sm mb-5">Secure Vehicle Management</p>

        <div id="vehicle-id-display" class="bg-black text-white font-bold py-2 px-6 rounded-md mb-6 text-xl inline-block tracking-wider">
            Loading...
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <button onclick="initiateDirectCall('call')" class="bg-black text-white font-semibold py-3 rounded-lg hover:bg-gray-800 transition">
                📞 Call Owner
            </button>
            <button onclick="initiateDirectCall('alternate')" class="bg-gray-200 text-gray-800 font-semibold py-3 rounded-lg hover:bg-gray-300 transition">
                📞 Call Alt
            </button>
        </div>

        <button onclick="sendEmergencySOS()" class="w-full bg-red-800 text-white font-bold py-4 rounded-lg mb-8 hover:bg-red-900 transition flex justify-center items-center gap-2">
            ⚠️ EMERGENCY SOS
        </button>

        <h2 class="text-xs font-bold text-gray-400 text-left mb-3 uppercase tracking-wide">Quick Alerts</h2>
        <div class="grid grid-cols-2 gap-3 mb-2">
            <button onclick="sendNormalAlert('Wrong Parking')" class="border border-gray-200 rounded-lg py-4 flex flex-col items-center justify-center text-sm font-medium text-gray-600 hover:bg-gray-50 transition shadow-sm">
                <span class="text-red-500 text-2xl mb-2">⚠️</span> Wrong Parking
            </button>
            <button onclick="sendNormalAlert('Tow Alert')" class="border border-gray-200 rounded-lg py-4 flex flex-col items-center justify-center text-sm font-medium text-gray-600 hover:bg-gray-50 transition shadow-sm">
                <span class="text-blue-500 text-2xl mb-2">🚙</span> Tow Alert
            </button>
            <button onclick="sendNormalAlert('Window Open')" class="border border-gray-200 rounded-lg py-4 flex flex-col items-center justify-center text-sm font-medium text-gray-600 hover:bg-gray-50 transition shadow-sm">
                <span class="text-gray-600 text-2xl mb-2">🪟</span> Window Open
            </button>
            <button onclick="sendNormalAlert('Light On')" class="border border-gray-200 rounded-lg py-4 flex flex-col items-center justify-center text-sm font-medium text-gray-600 hover:bg-gray-50 transition shadow-sm">
                <span class="text-yellow-500 text-2xl mb-2">💡</span> Light On
            </button>
        </div>
    </div>

    <script>
        // 1. URL se QR/Sticker ID nikalna (e.g., website.com/?id=UP80C08090)
        const urlParams = new URLSearchParams(window.location.search);
        // Default ID for testing agar URL me ID na ho
        const urlAssetId = urlParams.get('id') || 'ALQR1003'; 

        // Screen par ID dikhana
        document.getElementById('vehicle-id-display').innerText = urlAssetId;

        // Aapke Vercel Backend ka URL
        const VERCEL_API_URL = 'https://alerto-qr.vercel.app/api/send-alert';

        // 📞 ROUTE 1: POPUP WALI SECURE CALL
        async function initiateDirectCall(modeType) {
            let helperNum = prompt("Secure call connect karne ke liye apna 10-digit mobile number darj karein:");
            
            if (!helperNum || helperNum.length < 10) {
                alert("Call connect karne ke liye sahi number dena zaroori hai!");
                return;
            }

            alert("Securing connection... Kuch hi seconds mein aapke phone par ek incoming call aayegi. Kripya use uthayein!");

            try {
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        stickerId: urlAssetId, 
                        alertType: 'Call Owner',
                        mode: modeType, // 'call' ya 'alternate'
                        helperNumber: helperNum 
                    })
                });
                
                const result = await response.json();
                if (!result.success) {
                    alert("Backend Error: " + result.error);
                }
            } catch (err) {
                alert("Network Error: Server se connection nahi bana.");
            }
        }

        // 🚨 ROUTE 2: EMERGENCY SOS (Bina Popup, direct owner ko automated call)
        async function sendEmergencySOS() {
            alert("Emergency call owner ko lag rahi hai. Kripya wait karein...");
            try {
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        stickerId: urlAssetId, 
                        alertType: 'EMERGENCY SOS',
                        mode: 'call'
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert("SOS Call Successfully Placed!");
                } else {
                    alert("SOS Error: " + result.error);
                }
            } catch (err) {
                alert("Network Error: SOS fail ho gaya.");
            }
        }

        // 💬 ROUTE 3: NORMAL SMS ALERTS
        async function sendNormalAlert(alertMessage) {
            try {
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        stickerId: urlAssetId, 
                        alertType: alertMessage,
                        mode: 'sms'
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert(alertMessage + " ka alert SMS owner ko bhej diya gaya hai.");
                } else {
                    alert("SMS Error: " + result.error);
                }
            } catch (err) {
                alert("Network Error: Alert bhejne mein problem aayi.");
            }
        }
    </script>
</body>
</html>
