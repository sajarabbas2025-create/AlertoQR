<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AlertoQR Helper</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff !important;
            color: #000000 !important;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff !important;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation Strip matching original image */
        .header-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px 15px 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #000000;
        }

        .sticker-id-tag {
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        /* Profile Data Box View Card matching original upload template */
        .owner-info-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 20px;
            background-color: #ffffff !important;
        }

        .label-v-owner {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .owner-name {
            font-size: 28px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .vehicle-plate-badge {
            background-color: #000000;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        /* Call Action Elements Layout Framework */
        .call-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .btn-call-main {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 1px solid #000000;
            border-radius: 8px;
            padding: 14px 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-call-alt {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 14px 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Quick Alerts Subsection Grid Layout Framework components */
        .section-divider-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            padding-left: 2px;
        }

        .alerts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .grid-alert-card {
            background-color: #ffffff !important;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 22px 10px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #000000 !important;
            font-size: 14px;
            font-weight: 600;
        }

        .icon-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 0;
            color: #64748b;
            font-weight: 600;
        }

        #error-screen {
            display: none;
            color: #ef4444;
            text-align: center;
            padding: 60px 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 28px; color: #000; margin-bottom: 16px;"></i>
        <div>Verifying Vehicle Profile Live...</div>
    </div>

    <div id="dashboard-view" style="display: none !important;">
        
        <div class="header-strip">
            <span class="header-title">AlertoQR Helper</span>
            <span class="sticker-id-tag" id="lbl-sticker-id">ID: AGRA001</span>
        </div>

        <div class="owner-info-card">
            <div class="label-v-owner">Vehicle Owner</div>
            <div class="owner-name" id="lbl-owner-name">SAJAR ABBAS</div>
            <div class="vehicle-plate-badge" id="lbl-vehicle-number">UP32DD2420</div>
        </div>

        <div class="call-actions-row">
            <a href="#" id="lnk-main-call" class="btn-call-main">
                <i class="fa-solid fa-phone"></i> Call Owner
            </a>
            <a href="#" id="lnk-alt-call" class="btn-call-alt">
                <i class="fa-solid fa-phone"></i> Call Alternate
            </a>
        </div>

        <div class="section-divider-title">Quick Alerts</div>
        
        <div class="alerts-grid">
            <a href="#" id="lnk-alert-parking" target="_blank" class="grid-alert-card">
                <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png" class="icon-img" alt="Wrong Parking">
                <span>Wrong Parking</span>
            </a>

            <a href="#" id="lnk-alert-tow" target="_blank" class="grid-alert-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2330/2330453.png" class="icon-img" alt="Tow Alert">
                <span>Tow Alert</span>
            </a>

            <a href="#" id="lnk-alert-window" target="_blank" class="grid-alert-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2921/2921319.png" class="icon-img" alt="Open Window">
                <span>Open Window</span>
            </a>

            <a href="#" id="lnk-alert-location" target="_blank" class="grid-alert-card">
                <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png" class="icon-img" alt="Share Location">
                <span>Share Location</span>
            </a>
        </div>

    </div>

    <div id="error-screen">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 32px; margin-bottom: 12px;"></i>
        <div id="error-message-text">Sticker setup configuration missing.</div>
    </div>

</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        // CRITICAL CACHE ACTION BUSTER:
        // Agar link me '?v=' time token nahi hai, toh page browser cache ko skip karke naya reload karega!
        if (!urlParams.has('v')) {
            urlParams.set('v', Date.now());
            window.location.search = urlParams.toString();
            return;
        }

        const stickerId = urlParams.get('id');
        if (!stickerId || stickerId.trim() === "") {
            showErrorState("Scan Error: Missing Sticker ID Parameter.");
            return;
        }

        const cleanStickerId = stickerId.trim().toUpperCase();
        document.getElementById('lbl-sticker-id').innerText = `ID: ${cleanStickerId}`;

        try {
            const { data, error } = await _supabase
                .from('registrations')
                .select('mobile_number, vehicle_number, status, full_name')
                .eq('sticker_id', cleanStickerId)
                .maybeSingle();

            if (error) {
                showErrorState("Database connection error.");
                return;
            }

            if (!data) {
                window.location.href = `register.html?id=${cleanStickerId}`;
                return;
            }

            if (data.status === 'Active') {
                // Populate operational fields data directly
                document.getElementById('lbl-owner-name').innerText = data.full_name || "Vehicle Owner";
                document.getElementById('lbl-vehicle-number').innerText = data.vehicle_number;
                
                document.getElementById('lnk-main-call').href = `tel:${data.mobile_number}`;
                document.getElementById('lnk-alt-call').href = `tel:${data.mobile_number}`;
                
                // Formulate custom dynamic messages text
                const txtParking = encodeURIComponent(`Urgent Alert: Your vehicle (${data.vehicle_number}) is wrongly parked. Please check immediately.`);
                document.getElementById('lnk-alert-parking').href = `https://wa.me/91${data.mobile_number}?text=${txtParking}`;
                
                const txtTow = encodeURIComponent(`Urgent Alert: Your vehicle (${data.vehicle_number}) is about to be towed. Please reach out immediately.`);
                document.getElementById('lnk-alert-tow').href = `https://wa.me/91${data.mobile_number}?text=${txtTow}`;
                
                const txtWindow = encodeURIComponent(`Alert: Your vehicle (${data.vehicle_number}) window is left open.`);
                document.getElementById('lnk-alert-window').href = `https://wa.me/91${data.mobile_number}?text=${txtWindow}`;
                
                const txtLocation = encodeURIComponent(`Hello, I am near your vehicle (${data.vehicle_number}). Sharing live location context.`);
                document.getElementById('lnk-alert-location').href = `https://wa.me/91${data.mobile_number}?text=${txtLocation}`;

                // Force visibility styles overrides
                document.getElementById('loading-screen').style.setProperty('display', 'none', 'important');
                document.getElementById('dashboard-view').style.setProperty('display', 'block', 'important');
            } else {
                window.location.href = `register.html?id=${cleanStickerId}`;
            }

        } catch (err) {
            showErrorState("System configuration failure.");
        }
    });

    function showErrorState(msg) {
        document.getElementById('loading-screen').style.setProperty('display', 'none', 'important');
        document.getElementById('error-message-text').innerText = msg;
        document.getElementById('error-screen').style.setProperty('display', 'block', 'important');
    }
</script>
</body>
</html>
