<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlertoQR Helper Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Waisa hi hai jaisa aapka purana tha */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
        .helper-container { width: 100%; max-width: 480px; background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .calling-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .btn-call { padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-owner { background: #1e293b; color: white; }
        .btn-alternate { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; }
        .status-ticker { margin-bottom: 20px; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; display: none; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="helper-container">
    <div id="dashboard-view">
        <div class="calling-grid">
            <button class="btn-call btn-owner" onclick="dispatchTwilioMaskedCall()">
                <i class="fa-solid fa-phone"></i> Call Owner
            </button>
            <button class="btn-call btn-alternate" onclick="dialAlternateFallbackRoute()">
                <i class="fa-solid fa-phone"></i> Call Alt
            </button>
        </div>
        
        <div id="ticker-box" class="status-ticker"></div>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://cefzsgchfdvtyfmcrsda.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs');
    let primaryDestinationPhone = "";

    // CORRECTED MASKING LOGIC (Script ke andar)
    async function dispatchTwilioMaskedCall() {
        const ticker = document.getElementById('ticker-box');
        ticker.style.display = "block";
        ticker.innerText = "🔄 Connecting secure line...";
        
        try {
            const response = await fetch('/api/make-call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ownerPhone: primaryDestinationPhone })
            });
            
            if (response.ok) {
                ticker.innerText = "✅ Call connected via mask!";
            } else {
                throw new Error("Server Error");
            }
        } catch (err) {
            ticker.innerText = "❌ Masking failed. Opening dialer...";
            window.location.href = `tel:${primaryDestinationPhone}`;
        }
    }

    function dialAlternateFallbackRoute() {
        if(primaryDestinationPhone) {
            window.location.href = `tel:${primaryDestinationPhone}`;
        }
    }

    // Baaki ka load logic yahan rakhein...
    window.addEventListener('DOMContentLoaded', async () => {
        // ... apka data fetch logic ...
    });
</script>
</body>
</html>
