<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR - Helper</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; margin: 0; display: flex; justify-content: center; padding: 20px; }
        .app-container { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 800; color: #000; }
        .badge { background: #f0f0f0; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; color: #333; }
        
        /* Owner Card */
        .owner-card { border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .label { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 5px; }
        .owner-name { font-size: 20px; font-weight: bold; color: #222; margin-bottom: 10px; }
        .plate { background: #000; color: #fff; display: inline-block; padding: 6px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        
        /* Action Row */
        .action-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; text-align: center; padding: 12px 5px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; border: none; }
        .btn-black { background: #000; color: #fff; }
        .btn-outline { background: #fff; color: #000; border: 1px solid #ddd; }
        
        /* Grid Menu */
        .section-title { font-size: 12px; color: #888; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .grid-item { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px 5px; text-align: center; text-decoration: none; color: #333; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .grid-icon { font-size: 24px; }
        
        /* Emergency & Police */
        .btn-sos { background: #ff3b30; color: white; width: 100%; padding: 15px; font-size: 16px; margin-bottom: 15px; }
        .btn-light-red { background: #fff5f5; color: #ff3b30; border: 1px solid #ffd1d1; }
        
        #loading-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: white; display: flex; justify-content: center; align-items: center; z-index: 10; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div id="loading-overlay">Gaadi ka data load ho raha hai...</div>

<div class="app-container">
    <div class="header">
        <div class="logo">AlertoQR</div>
        <div class="badge" id="display-id">ID: ------</div>
    </div>

    <div class="owner-card">
        <div class="label">VEHICLE OWNER</div>
        <div class="owner-name" id="display-name">Loading...</div>
        <div class="plate" id="display-plate">-------</div>
    </div>

    <div class="action-row">
        <a id="btn-call" class="btn btn-black">📞 Call Owner</a>
        <a class="btn btn-outline" onclick="alert('Alternate number is not available yet.')">📞 Call Alternate</a>
    </div>

    <div class="section-title">QUICK ALERTS</div>
    
    <div class="grid">
        <a id="btn-wrong-parking" class="grid-item">
            <span class="grid-icon">⚠️</span>
            <span>Wrong Parking</span>
        </a>
        <a id="btn-tow" class="grid-item">
            <span class="grid-icon">🚓</span>
            <span>Tow Alert</span>
        </a>
        <a id="btn-door" class="grid-item">
            <span class="grid-icon">🚨</span>
            <span>Door/Window<br>& Light ON</span>
        </a>
        <a id="btn-photo" class="grid-item">
            <span class="grid-icon">📸</span>
            <span>Share Photo</span>
        </a>
    </div>

    <a id="btn-sos" class="btn btn-sos">🚨 EMERGENCY SOS</a>

    <div class="action-row">
        <a href="tel:112" class="btn btn-light-red">👮‍♂️ Call Police</a>
        <a href="tel:108" class="btn btn-light-red">🚑 Ambulance</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const stickerId = urlParams.get('id');

    window.onload = () => {
        if (!stickerId) {
            document.getElementById('loading-overlay').innerText = "Invalid QR Code!";
        } else {
            document.getElementById('display-id').innerText = `ID: ${stickerId.toUpperCase()}`;
            fetchOwnerData();
        }
    };

    async function fetchOwnerData() {
        try {
            const response = await fetch('/api/sos-alert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stickerId: stickerId })
            });
            
            const result = await response.json();
            
            if (result.success && result.mobileNumber) {
                document.getElementById('loading-overlay').style.display = 'none';
                
                // UI Update
                document.getElementById('display-name').innerText = result.ownerName;
                document.getElementById('display-plate').innerText = result.vehicleNumber;
                
                const num = result.mobileNumber;

                // Call Owner
                document.getElementById('btn-call').href = `tel:+${num}`;
                
                // WhatsApp & SMS Links setup
                const waBase = `https://wa.me/${num}?text=`;
                const smsBase = `sms:+${num}?body=`;

                // Share Photo (Direct WhatsApp)
                document.getElementById('btn-photo').href = waBase + encodeURIComponent("Emergency! Main aapki gaadi ke paas hu, aapko photo bhej raha hu.");
                
                // Wrong Parking (Direct WhatsApp/SMS)
                document.getElementById('btn-wrong-parking').href = waBase + encodeURIComponent("Alert! Aapki gaadi galat jagah park hai, kripya ise hatayein.");
                
                // Tow Alert
                document.getElementById('btn-tow').href = waBase + encodeURIComponent("Alert! Aapki gaadi Tow hone wali hai, jaldi aaiye.");
                
                // Door/Light
                document.getElementById('btn-door').href = waBase + encodeURIComponent("Alert! Aapki gaadi ka darwaza khula hai ya light ON rah gayi hai.");
                
                // Emergency SOS (Direct Call or SMS)
                document.getElementById('btn-sos').href = smsBase + encodeURIComponent("🚨 EMERGENCY! Gaadi ke paas emergency hai, turant sampark karein.");

            } else {
                document.getElementById('loading-overlay').innerText = `Error: ${result.error}`;
            }
        } catch (err) {
            document.getElementById('loading-overlay').innerText = "Network issue. Please refresh.";
        }
    }
</script>

</body>
</html>
