<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard & Profile Control - AlertoQR</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #0b1329; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .dashboard-card { background-color: #1c2541; border: 1px solid #1e293b; border-radius: 16px; padding: 30px; width: 100%; max-width: 460px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .header h2 { font-size: 22px; color: #ffffff; font-weight: 800; }
        .sticker-badge { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #fbbf24; padding: 4px 12px; border-radius: 6px; font-weight: 800; font-size: 13px; display: inline-block; margin-top: 6px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        .form-input { background-color: #0b1329; border: 1px solid #475569; border-radius: 7px; padding: 12px; color: #ffffff; font-size: 15px; outline: none; width: 100%; }
        .form-input:focus { border-color: #2563eb; }
        
        .btn { width: 100%; padding: 13px; border-radius: 7px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; margin-top: 10px; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-success { background-color: #10b981; color: white; }
        
        .link-forgot { color: #38bdf8; font-size: 13px; text-decoration: none; font-weight: 600; cursor: pointer; text-align: right; display: block; margin-top: -8px; margin-bottom: 15px; }
        .link-forgot:hover { text-decoration: underline; }
        
        /* Modal Popup Architecture */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #1c2541; border: 1px solid #334155; color: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { font-size: 18px; font-weight: 700; margin-bottom: 18px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 8px; color: #ffffff; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        
        .view-state { display: none; }
        .active-state { display: block; }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header">
        <h2>Owner Profile Control</h2>
        <span class="sticker-badge" id="lbl-sticker-id">Loading ID...</span>
    </div>

    <div id="error-alert" class="alert-error" style="display:none;"></div>

    <div id="panel-auth" class="view-state active-state">
        <div class="form-group">
            <label>Enter Security PIN</label>
            <input type="password" id="auth-pin" class="form-input" placeholder="Profile edit karne ke liye 4-digit PIN dalein" maxlength="4" pattern="[0-9]*" inputmode="numeric">
        </div>
        <span class="link-forgot" onclick="openForgotModal()">Forgot Security PIN?</span>
        <button class="btn btn-primary" onclick="verifyOwnerAccess()"><i class="fa-solid fa-unlock"></i> Unlock Profile Settings</button>
    </div>

    <div id="panel-edit" class="view-state">
        <p style="color:#10b981; font-size:13px; font-weight:700; text-align:center; margin-bottom:15px;"><i class="fa-solid fa-lock-open"></i> Profile access unlocked successfully.</p>
        
        <div class="form-group">
            <label>Owner Full Name</label>
            <input type="text" id="edit-name" class="form-input" required>
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="edit-mobile" class="form-input" maxlength="10" required>
        </div>
        <div class="form-group">
            <label>Vehicle Number</label>
            <input type="text" id="edit-vehicle" class="form-input" style="text-transform: uppercase;" required>
        </div>
        <button class="btn btn-success" onclick="saveUpdatedProfile()"><i class="fa-solid fa-floppy-disk"></i> Save Profile Updates</button>
    </div>
</div>

<div id="forgotModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><i class="fa-solid fa-shield-halved"></i> Secure PIN Reset</div>
        <div id="modal-error" class="alert-error" style="display:none;"></div>
        
        <div id="forgot-step-1">
            <div class="form-group">
                <label>Registered Mobile Number</label>
                <input type="tel" id="forgot-mobile" class="form-input" placeholder="10-digit number dalein" maxlength="10">
            </div>
            <div class="form-group">
                <label>Vehicle Number</label>
                <input type="text" id="forgot-vehicle" class="form-input" placeholder="e.g. UP32DD2420" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label>Chassis / Engine No. (Last 4 Digits)</label>
                <input type="text" id="forgot-chassis" class="form-input" placeholder="Aakhri 4 ank dalein" maxlength="4">
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:#475569; color:white;" onclick="closeForgotModal()">Cancel</button>
                <button class="btn btn-primary" onclick="verifyIdentityForPinReset()">Verify Identity</button>
            </div>
        </div>

        <div id="forgot-step-2" style="display:none;">
            <p style="color:#10b981; font-size:13px; font-weight:700; text-align:center; margin-bottom:12px;">✅ Identity Verified! Set your new pin.</p>
            <div class="form-group">
                <label>Enter New 4-Digit PIN</label>
                <input type="password" id="forgot-new-pin" class="form-input" placeholder="Naya secret PIN banayein" maxlength="4" pattern="[0-9]*" inputmode="numeric">
            </div>
            <button class="btn btn-success" onclick="commitNewSecurityPin()">Update Security PIN</button>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let STICKER_ID = "";
    let SERVER_RECORD_OBJECT = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        STICKER_ID = urlParams.get('id');

        if(!STICKER_ID) {
            showError("Invalid URL. Sticker Link ID parameter node missing.");
            document.body.innerHTML = `<div class="alert-error" style='margin:auto;'>Error: Sticker ID missing in URL.</div>`;
            return;
        }

        STICKER_ID = STICKER_ID.trim().toUpperCase();
        document.getElementById('lbl-sticker-id').innerText = `Sticker ID: ${STICKER_ID}`;

        // Initial fetch to lock record maps
        await syncServerData();
    });

    async function syncServerData() {
        try {
            const { data, error } = await _supabase.from('registrations').select('*').eq('sticker_id', STICKER_ID).maybeSingle();
            if(error) throw error;
            if(!data) {
                showError("This sticker ID node is not registered on servers yet.");
                return;
            }
            SERVER_RECORD_OBJECT = data;
        } catch(e) { showError("Database connection pipeline sync timed out."); }
    }

    // 🔑 VERIFY SECURITY MPIN CODE
    async function verifyOwnerAccess() {
        hideError();
        const enteredPin = document.getElementById('auth-pin').value.trim();

        if(!SERVER_RECORD_OBJECT) { await syncServerData(); }
        if(!SERVER_RECORD_OBJECT) return;

        // Fallback default password logic is 1234 if newly generated or reset by admin
        const accuratePin = SERVER_RECORD_OBJECT.mpin || "1234";

        if(enteredPin === String(accuratePin).trim()) {
            // Hydrate Edit Form
            document.getElementById('edit-name').value = SERVER_RECORD_OBJECT.full_name || "";
            document.getElementById('edit-mobile').value = SERVER_RECORD_OBJECT.mobile_number || "";
            document.getElementById('edit-vehicle').value = SERVER_RECORD_OBJECT.vehicle_number || "";
            
            // Switch Panel Toggles
            document.getElementById('panel-auth').style.display = "none";
            document.getElementById('panel-edit').style.display = "block";
        } else {
            showError("❌ Invalid Security PIN! Please try again.");
        }
    }

    // 💾 COMMIT UPDATED PROFILE BACK TO SUPABASE
    async function saveUpdatedProfile() {
        hideError();
        const updatedName = document.getElementById('edit-name').value.trim();
        const updatedMobile = document.getElementById('edit-mobile').value.trim();
        const updatedVehicle = document.getElementById('edit-vehicle').value.trim().toUpperCase();

        if(!updatedName || !updatedMobile || !updatedVehicle) { showError("All fields are mandatory."); return; }

        try {
            const { error } = await _supabase
                .from('registrations')
                .update({
                    full_name: updatedName,
                    mobile_number: updatedMobile,
                    vehicle_number: updatedVehicle
                })
                .eq('sticker_id', STICKER_ID);

            if(error) throw error;
            alert("✅ Profile changes saved successfully!");
            location.reload(); // Reload dashboard safely
        } catch(e) { showError(`Update failed: ${e.message}`); }
    }

    // 🔒 FORGOT PIN SUB-SYSTEM LOGIC ENGINES
    function openForgotModal() {
        document.getElementById('modal-error').style.display = "none";
        document.getElementById('forgot-step-1').style.display = "block";
        document.getElementById('forgot-step-2').style.display = "none";
        document.getElementById('forgotModal').style.display = "flex";
    }

    function closeForgotModal() { document.getElementById('forgotModal').style.display = "none"; }

    async function verifyIdentityForPinReset() {
        const fMobile = document.getElementById('forgot-mobile').value.trim();
        const fVehicle = document.getElementById('forgot-vehicle').value.trim().toUpperCase();
        const fChassis = document.getElementById('forgot-chassis').value.trim();

        if(!fMobile || !fVehicle || !fChassis) { showModalError("Please input all authentication values."); return; }
        if(!SERVER_RECORD_OBJECT) { await syncServerData(); }

        const dbMobile = String(SERVER_RECORD_OBJECT.mobile_number).trim();
        const dbVehicle = String(SERVER_RECORD_OBJECT.vehicle_number).trim().toUpperCase();
        const dbChassis = String(SERVER_RECORD_OBJECT.chassis_last_4).trim();

        // 🛡️ BULLETPROOF IDENTITY VALIDATION MATRICES 
        if(fMobile === dbMobile && fVehicle === dbVehicle && fChassis === dbChassis) {
            document.getElementById('forgot-step-1').style.display = "none";
            document.getElementById('forgot-step-2').style.display = "block";
            document.getElementById('modal-error').style.display = "none";
        } else {
            showModalError("❌ Identity Match Mismatch! Check details or consult support.");
        }
    }

    async function commitNewSecurityPin() {
        const newPin = document.getElementById('forgot-new-pin').value.trim();
        if(newPin.length < 4 || isNaN(newPin)) { showModalError("PIN must be exactly 4 numeric digits."); return; }

        try {
            const { error } = await _supabase
                .from('registrations')
                .update({ mpin: newPin })
                .eq('sticker_id', STICKER_ID);

            if(error) throw error;
            alert("🎉 Security PIN updated successfully! Login using your new PIN.");
            closeForgotModal();
            location.reload();
        } catch(e) { showModalError("Failed to update database schema PIN."); }
    }

    // ERRORS DESCRIPTOR SYSTEMS
    function showError(t) { const e = document.getElementById('error-alert'); e.innerText = t; e.style.display = "block"; }
    function hideError() { document.getElementById('error-alert').style.display = "none"; }
    function showModalError(t) { const e = document.getElementById('modal-error'); e.innerText = t; e.style.display = "block"; }
</script>
</body>
</html>
