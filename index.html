<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR - Official</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0d1117; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { border: 1.5px solid #2ea043; padding: 25px; border-radius: 24px; background: #161b22; width: 100%; max-width: 340px; box-sizing: border-box; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 15px; margin: 12px 0; border-radius: 14px; color: white; text-decoration: none; font-weight: 600; font-size: 15px; border: none; width: 100%; box-sizing: border-box; cursor: pointer; }
        .p-call { background: #238636; }
        .parking { background: #f0883e; }
        .tow { background: #8957e5; }
        .loc { background: #1f6feb; }
        .amb { background: #da3633; margin-top: 20px; }
        input { padding: 14px; margin: 10px 0; width: 100%; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #2ea043; margin-bottom: 5px;">AlertoQR</h2>
        <p style="font-size: 12px; color: #8b949e; text-transform: uppercase;">Smart Vehicle Security</p>
        
        <div id="setupForm">
            <input type="text" id="num1" placeholder="Enter Mobile Number">
            <button class="btn p-call" onclick="generateQR()">Generate My QR Sticker</button>
            <center><div id="qrcode" style="margin-top:20px; background:white; padding:15px; display:none; border-radius:15px;"></div></center>
        </div>

        <div id="helperPanel" style="display: none;">
            <a id="callBtn" href="#" class="btn p-call">📞 Call Vehicle Owner</a>
            <a id="parkBtn" href="#" class="btn parking">🚗 Wrong Parking Alert</a>
            <a id="towBtn" href="#" class="btn tow">⚠️ Vehicle Being Towed</a>
            <button onclick="shareLoc()" class="btn loc">📍 Share My Live Location</button>
            <a href="tel:108" class="btn amb">🚑 Call Ambulance (108)</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const num = params.get('num');

        if (num) {
            document.getElementById('setupForm').style.display = 'none';
            document.getElementById('helperPanel').style.display = 'block';
            document.getElementById('callBtn').href = "tel:" + num;
            document.getElementById('parkBtn').href = "https://wa.me/" + num + "?text=AlertoQR Alert: Your vehicle is blocking the way. Please move it.";
            document.getElementById('towBtn').href = "https://wa.me/" + num + "?text=AlertoQR Urgent: Your vehicle is being towed!";
        }

        function shareLoc() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const mapLink = `http://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    window.location.href = `https://wa.me/${num}?text=AlertoQR Location Alert: ${mapLink}`;
                });
            } else { alert("Enable GPS"); }
        }

        function generateQR() {
            const n1 = document.getElementById('num1').value;
            const qrDiv = document.getElementById('qrcode');
            if(n1) {
                qrDiv.innerHTML = "";
                qrDiv.style.display = "block";
                const link = window.location.href.split('?')[0] + "?num=" + n1;
                new QRCode(qrDiv, { text: link, width: 180, height: 180 });
            } else { alert("Please enter a number"); }
        }
    </script>
</body>
</html>
