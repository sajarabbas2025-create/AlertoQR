<!DOCTYPE html>
<html>
<head>
    <title>AlertoQR - Smart System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        .box { border: 2px solid #22c55e; padding: 25px; border-radius: 20px; display: inline-block; background: #1e293b; width: 320px; }
        input { padding: 12px; margin: 8px 0; width: 90%; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        .gen-btn { background: #22c55e; color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; width: 95%; font-weight: bold; }
        #qrcode { margin-top: 20px; background: white; padding: 15px; display: none; border-radius: 12px; }
        .btn-call { display: block; padding: 15px; margin: 12px 0; border-radius: 12px; color: white; text-decoration: none; font-weight: bold; font-size: 18px; }
        .p-call { background: #3b82f6; }
        .amb-call { background: #ef4444; }
    </style>
</head>
<body>
    <div class="box">
        <h1 style="color: #22c55e;">AlertoQR</h1>
        
        <div id="setupForm">
            <p>Enter number to generate QR</p>
            <input type="text" id="num1" placeholder="Mobile Number">
            <button class="gen-btn" onclick="generateQR()">Generate Smart QR</button>
            <center><div id="qrcode"></div></center>
        </div>

        <div id="helperPanel" style="display: none;">
            <p style="color: #22c55e;">🚨 Emergency Dashboard</p>
            <a id="callBtn" href="#" class="btn-call p-call">📞 Call Vehicle Owner</a>
            <a href="tel:108" class="btn-call amb-call">🚑 Call Ambulance</a>
        </div>
    </div>

    <script>
        // SMART LOGIC: Check number in link
        const params = new URLSearchParams(window.location.search);
        const num = params.get('num');

        if (num) {
            document.getElementById('setupForm').style.display = 'none';
            document.getElementById('helperPanel').style.display = 'block';
            document.getElementById('callBtn').href = "tel:" + num;
        }

        function generateQR() {
            let n1 = document.getElementById('num1').value;
            let qrDiv = document.getElementById('qrcode');
            if(n1) {
                qrDiv.innerHTML = "";
                qrDiv.style.display = "block";
                let link = "https://sajarabbas2025-create.github.io/AlertoQR/index.html?num=" + n1;
                new QRCode(qrDiv, { text: link, width: 180, height: 180 });
            }
        }
    </script>
</body>
</html>
