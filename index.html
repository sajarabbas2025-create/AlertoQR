<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR - Register Sticker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; border: 1px solid #30363d; }
        h2 { color: #2ea043; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8b949e; font-size: 14px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; font-size: 16px; }
        input:focus { border-color: #58a6ff; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: #238636; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #2ea043; }
        #msg { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Activate Sticker</h2>
        <p id="stickerInfo" style="text-align: center; color: #8b949e; margin-bottom: 20px;">ID: Loading...</p>
        
        <form id="regForm">
            <div class="input-group">
                <label>Owner Name</label>
                <input type="text" id="name" placeholder="Enter full name" required>
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter 10 digit number" required>
            </div>
            <div class="input-group">
                <label>Vehicle Number</label>
                <input type="text" id="vNo" placeholder="e.g. UP32DD2420" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">ACTIVATE STICKER</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        // APKA GOOGLE SCRIPT URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzytYi2Z_MjlgcMn-AbuKUCg2NC0_ZH1J0BnTuzENXW_yCqO74-stp52OAhqovClEWY/exec";
        
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        
        if (id) {
            document.getElementById('stickerInfo').innerText = "Sticker ID: " + id;
        } else {
            document.body.innerHTML = "<h2>Invalid Link</h2>";
        }

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            
            btn.innerText = "Processing...";
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('action', 'register');
            formData.append('id', id);
            formData.append('name', document.getElementById('name').value);
            formData.append('mobile', document.getElementById('mobile').value);
            formData.append('vNo', document.getElementById('vNo').value);

            // GOOGLE SHEET ME DATA BHEJNA
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    alert("Sticker Activated Successfully!");
                    window.location.href = `index.html?id=${id}`;
                } else {
                    msg.innerText = "Error: " + data.message;
                    msg.style.color = "#da3633";
                    btn.innerText = "ACTIVATE STICKER";
                    btn.disabled = false;
                }
            })
            .catch(err => {
                msg.innerText = "Something went wrong. Please check internet.";
                msg.style.color = "#da3633";
                btn.innerText = "ACTIVATE STICKER";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
