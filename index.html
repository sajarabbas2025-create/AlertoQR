<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Alert - AlertoQR</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 90%; max-width: 400px; padding: 40px 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #0056b3; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-size: 16px; }
        .btn { display: block; width: 100%; padding: 18px; margin: 15px 0; border-radius: 30px; font-size: 18px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; box-sizing: border-box; }
        .btn-call { background: #0056b3; color: white; }
        .btn-wa { background: #25D366; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Emergency Alert</h1>
        <p>Owner's Vehicle: <span id="v-num" style="font-weight:bold; color:#333;">Loading...</span></p>
        
        <a href="#" id="call-link" class="btn btn-call">Call Owner</a>
        <a href="#" id="wa-link" class="btn btn-wa">WhatsApp Message</a>
    </div>

    <script>
        // Supabase se data fetch karne ka logic kal lagayenge, abhi sirf layout hai
        const urlParams = new URLSearchParams(window.location.search);
        const sid = urlParams.get('id');
        if(sid) { document.getElementById('v-num').innerText = "Sticker " + sid; }
    </script>
</body>
</html>
