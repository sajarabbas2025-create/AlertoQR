<body>
    <div id="loader">Checking Sticker...</div>
    
    <div id="mainContent" style="display:none;" class="box">
        <div id="renewalAlert" style="background:red; color:white; display:none; padding:10px; border-radius:10px; margin-bottom:10px;">
            ⚠️ Plan Expiring Soon! Tap to Renew.
        </div>
        
        <h2 style="color:#2ea043;">AlertoQR</h2>
        <p id="ownerDisplay" style="font-size:14px; margin-bottom:20px;"></p>
        
        <a id="btnCall" class="btn p-call">📞 Call Vehicle Owner</a>
        <a id="btnPark" class="btn p-parking">🚗 Wrong Parking Alert</a>
        <a id="btnTow" class="btn tow">⚠️ Vehicle Being Towed</a>
        <button onclick="shareLoc()" class="btn loc">📍 Share My Live Location</button>
        <a href="tel:108" class="btn amb">🚑 Call Ambulance (108)</a>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbkXEFxRuX8gO3m664dv8Q8yGYoRjnbJEDqJyhYSLtYNKEshHWZpeN_6HU25w7Pg/exec"; //
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (id) {
            fetch(`${SCRIPT_URL}?action=check&id=${id}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                if (data.status === "not_found") {
                    // Agar registered nahi hai toh registration page par bhejein
                    window.location.href = `register.html?id=${id}`;
                } else {
                    // Agar registered hai toh helper buttons dikhayein
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('ownerDisplay').innerText = `Vehicle: ${data.vNo}`;
                    document.getElementById('btnCall').href = `tel:${data.mobile}`;
                    // Baki buttons ka link bhi yahan set karein
                }
            });
        }
    </script>
</body>
