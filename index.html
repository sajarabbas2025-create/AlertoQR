<!DOCTYPE html>
<html>
<head>
    <title>AlertoQR - Privacy First</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0b0f1a; color: white; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; }
        .box { border: 1.5px solid #22c55e; padding: 20px; border-radius: 24px; display: inline-block; background: #161b22; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { display: flex; align-items: center; justify-content: center; padding: 14px; margin: 10px 0; border-radius: 12px; color: white; text-decoration: none; font-weight: 600; font-size: 15px; border: none; width: 100%; transition: 0.3s; }
        .p-call { background: #2563eb; } /* Primary Blue */
        .parking { background: #d97706; } /* Warning Orange */
        .tow { background: #7c3aed; } /* Tow Purple */
        .loc { background: #0891b2; } /* Location Cyan */
        .amb { background: #dc2626; border: 1px solid rgba(255,255,255,0.2); } /* Emergency Red */
        input { padding: 12px; margin: 10px 0; width: 85%; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 16px; }
        .status-tag { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #22c55e; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin: 0; color: #22c55e;">AlertoQR</h2>
        <span class="status-tag">Vehicle Safety System</span>
        
        <div id="setupForm">
            <input type="text" id="num1" placeholder="Mobile Number">
            <button class="btn p-call" onclick="generateQR()">Create Smart Sticker</button>
            <center><div id="qrcode" style="margin-top:20px; background:white; padding:15px; display:none; border-radius:12px;"></div></center>
        </div>

        <div id="helperPanel" style="display: none;">
            <a id="callBtn" href="#" class="btn p-call">📞 Call Owner</a>
            <a id="parkBtn" href="#" class="btn parking">🚗 Wrong Parking Alert</a>
            <a id="towBtn" href="#" class="btn tow">⚠️ Towing Alert</a>
            <button onclick="shareLoc()" class="btn loc">📍 Share My Location</button>
            <div style="margin: 15px 0; height: 1px; background: #30363d;"></div>
            <a href="tel:108" class="btn amb">🚑 Call Ambulance (108)</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const num = params.get('num');

        if (num) {
            document.getElementById('setupForm').style.display = 'none';
            document.getElementById('helperPanel').style.display = 'block';
            document.getElementById('callBtn').href = "tel:" + num;
            // Privacy Tip: WhatsApp link allows messaging without saving number
            document.getElementById('parkBtn').href = "https://wa.me/" + num + "?text=Hello, your vehicle is blocking the way. Please check.";
            document.getElementById('towBtn').href = "https://wa.me/" + num + "?text=Urgent! Your vehicle is being towed.";
        }

        function shareLoc() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    window.location.href = `https://wa.me/${num}?text=Emergency near your vehicle. My Location: ${mapLink}`;
                });
            } else { alert("Enable GPS to share location"); }
        }

        function generateQR() {
            let n1 = document.getElementById('num1').value;
            let qrDiv = document.getElementById('qrcode');
            if(n1) {
                qrDiv.innerHTML = ""; qrDiv.style.display = "block";
                let link = "https://sajarabbas2025-create.github.io/AlertoQR/index.html?num=" + n1;
                new QRCode(qrDiv, { text: link, width: 180, height: 180 });
            }
        }
    </script>
</body>
</html>
