<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Super Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #fff; font-size: 28px; margin-bottom: 25px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        
        /* Stats Styling */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 24px; font-weight: bold; color: #38bdf8; }
        
        /* Bulk QR Section Styling */
        .panel-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 20px; margin-bottom: 30px; }
        h2 { margin-top: 0; font-size: 18px; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-field { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 10px; border-radius: 6px; font-size: 14px; flex: 1; min-width: 120px; }
        
        /* QR Output Display Grid */
        .qr-display-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; max-height: 400px; overflow-y: auto; }
        .qr-card { background: white; padding: 12px; border-radius: 8px; text-align: center; width: 130px; margin: 0 auto; }
        .qr-holder { display: flex; justify-content: center; margin-bottom: 5px; }
        .sticker-id { font-weight: bold; font-size: 14px; color: #0f172a; font-family: monospace; }
        .brand-name { font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }

        /* Table Styling */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-size: 13px; text-transform: uppercase; }
        td { color: #f8fafc; font-size: 14px; }
        
        /* Badges & Buttons */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #16a34a; color: #fff; }
        .badge-expired { background: #dc2626; color: #fff; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-activate { background: #16a34a; color: #fff; }
        .btn-activate:hover { background: #15803d; }
        .btn-edit { background: #eab308; color: #fff; }
        .btn-save { background: #06b6d4; color: #fff; }
        .btn-cancel { background: #64748b; color: #fff; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #10b981; color: #fff; }
        .edit-input { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; font-size: 14px; width: 120px; }
        .loading { text-align: center; color: #94a3b8; padding: 20px; }

        /* 🖨️ PRINT CONTROL: Print karte waqt baki sab gayab ho jayega, sirf QR stickers dikhenge */
        @media print {
            body { background: white; color: black; padding: 0; }
            .container > *:not(#qr-print-section) { display: none !notimportant; }
            .container { max-width: 100%; }
            #qr-print-section { border: none; background: transparent; padding: 0; max-height: none; overflow: visible; display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 20px; }
            .qr-card { border: 1px dashed #000; box-shadow: none; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AlertoQR Control Control Panel</h1>

    <div class="stats-grid">
        <div class="stat-card"><h3>Total Earnings</h3><p id="stat-earnings">₹0</p></div>
        <div class="stat-card"><h3>Active Users</h3><p id="stat-active" style="color: #4ade80;">0</p></div>
        <div class="stat-card"><h3>Expired Users</h3><p id="stat-expired" style="color: #f87171;">0</p></div>
    </div>

    <div class="panel-card">
        <h2>🖨️ Bulk QR Code Generator</h2>
        <div class="input-group">
            <input type="text" id="qr-prefix" class="input-field" value="AGRA" placeholder="Prefix (e.g. AGRA)">
            <input type="number" id="qr-start" class="input-field" value="1" placeholder="Start No.">
            <input type="number" id="qr-end" class="input-field" value="10" placeholder="End No.">
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="generateAdminBulkQRs()">🚀 Generate QR Codes</button>
            <button class="btn btn-success" id="btn-print-qr" onclick="window.print()" style="display: none;">🖨️ Print Generated QR Sheets</button>
        </div>
        <div class="qr-display-grid" id="qr-print-section" style="display: none;"></div>
    </div>

    <div class="panel-card">
        <h2>👥 Customer Registrations & Plan Controls</h2>
        <div id="loading-text" class="loading">Loading database records...</div>
        <div class="table-wrapper">
            <table id="data-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Sticker ID</th>
                        <th>Owner Name</th>
                        <th>Vehicle Number</th>
                        <th>Status</th>
                        <th>Expiry Date</th>
                        <th>Action Controls</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allRecords = [];
    let editingId = null;

    // ⚡ BULK QR GENERATOR FUNCTION
    function generateAdminBulkQRs() {
        const prefix = document.getElementById('qr-prefix').value.trim().toUpperCase();
        const startNum = parseInt(document.getElementById('qr-start').value);
        const endNum = parseInt(document.getElementById('qr-end').value);
        const displayGrid = document.getElementById('qr-print-section');
        
        if (!prefix || isNaN(startNum) || isNaN(endNum) || startNum > endNum) {
            alert("Please enter a valid Prefix, Start Number, and End Number.");
            return;
        }

        displayGrid.innerHTML = '';
        displayGrid.style.display = 'grid';

        // 🧠 AUTOMATIC LIVE DOMAIN BASE DETECTOR (Aapki live link automatic pakad lega)
        const currentDomain = window.location.origin + window.location.pathname.replace('admin.html', 'dashboard.html');
        const baseDashboardUrl = `${currentDomain}?id=`;

        for (let i = startNum; i <= endNum; i++) {
            const formattedNum = String(i).padStart(3, '0');
            const currentStickerId = `${prefix}${formattedNum}`;
            const finalScanUrl = `${baseDashboardUrl}${currentStickerId}`;

            const qrCard = document.createElement('div');
            qrCard.className = 'qr-card';
            qrCard.innerHTML = `
                <div class="brand-name">AlertoQR</div>
                <div class="qr-holder" id="admin-qr-${currentStickerId}"></div>
                <div class="sticker-id">${currentStickerId}</div>
            `;
            displayGrid.appendChild(qrCard);

            new QRCode(document.getElementById(`admin-qr-${currentStickerId}`), {
                text: finalScanUrl,
                width: 110,
                height: 110,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        document.getElementById('btn-print-qr').style.display = 'inline-block';
    }

    // 📋 DATABASE TABLE LOGIC
    async function loadAdminPanelData() {
        document.getElementById('loading-text').style.display = 'block';
        document.getElementById('data-table').style.display = 'none';

        let { data: records, error } = await _supabase.from('registrations').select('*').order('created_at', { ascending: false });

        if (error || !records) {
            document.getElementById('loading-text').innerText = "❌ Database loading failed!";
            return;
        }

        allRecords = records;
        calculateStats();
        renderTableRows();

        document.getElementById('loading-text').style.display = 'none';
        document.getElementById('data-table').style.display = 'table';
    }

    function calculateStats() {
        let totalEarnings = 0;
        let activeCount = 0;
        let expiredCount = 0;
        const today = new Date();
        today.setHours(0,0,0,0);

        allRecords.forEach(row => {
            if (row.plan_price) totalEarnings += Number(row.plan_price);

            const expDateStr = row.expiry_date;
            if (expDateStr) {
                const expDate = new Date(expDateStr);
                expDate.setHours(0,0,0,0);
                if (expDate >= today && row.status === 'Active') {
                    activeCount++;
                } else {
                    expiredCount++;
                }
            } else {
                expiredCount++;
            }
        });

        document.getElementById('stat-earnings').innerText = `₹${totalEarnings}`;
        document.getElementById('stat-active').innerText = activeCount;
        document.getElementById('stat-expired').innerText = expiredCount;
    }

    function renderTableRows() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        const today = new Date();
        today.setHours(0,0,0,0);

        allRecords.forEach(row => {
            const tr = document.createElement('tr');
            const isEditing = (editingId === row.sticker_id);

            const expDateStr = row.expiry_date || '';
            let displayStatus = "Expired";
            let statusClass = "badge-expired";
            let formattedDate = "N/A";

            if (expDateStr) {
                const expDate = new Date(expDateStr);
                expDate.setHours(0,0,0,0);
                if (expDate >= today && row.status === 'Active') {
                    displayStatus = "Active";
                    statusClass = "badge-active";
                }
                const d = String(expDate.getDate()).padStart(2, '0');
                const m = String(expDate.getMonth() + 1).padStart(2, '0');
                formattedDate = `${d}-${m}-${expDate.getFullYear()}`;
            }

            tr.innerHTML = `
                <td><b>${row.sticker_id || 'N/A'}</b></td>
                <td>${isEditing ? `<input type="text" class="edit-input" id="inp-name-${row.sticker_id}" value="${row.full_name || ''}">` : (row.full_name || 'N/A')}</td>
                <td>${isEditing ? `<input type="text" class="edit-input" id="inp-vehicle-${row.sticker_id}" value="${row.vehicle_number || ''}">` : (row.vehicle_number || 'N/A')}</td>
                <td><span class="badge ${statusClass}">${displayStatus}</span></td>
                <td>${formattedDate}</td>
                <td>
                    ${isEditing ? `
                        <button class="btn btn-save" onclick="saveAdminEdit('${row.sticker_id}')">💾 Save</button>
                        <button class="btn btn-cancel" onclick="cancelAdminEdit()">Cancel</button>
                    ` : `
                        <button class="btn btn-activate" onclick="activateSubscription('${row.sticker_id}')">⚡ Activate (1 Year)</button>
                        <button class="btn btn-edit" onclick="startAdminEdit('${row.sticker_id}')">✏️ Edit</button>
                    `}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function activateSubscription(stickerId) {
        const newExpiry = new Date();
        newExpiry.setFullYear(newExpiry.getFullYear() + 1); // 2027 Expiry logic
        
        const yyyy = newExpiry.getFullYear();
        const mm = String(newExpiry.getMonth() + 1).padStart(2, '0');
        const dd = String(newExpiry.getDate()).padStart(2, '0');
        const dbDateFormat = `${yyyy}-${mm}-${dd}`;

        const updatePayload = { status: 'Active', expiry_date: dbDateFormat };
        let { error } = await _supabase.from('registrations').update(updatePayload).eq('sticker_id', stickerId);

        if(error) { alert("Error activating subscription!"); return; }

        alert(`Status Updated Successfully! 🚀 Sticker ${stickerId} activated till ${dd}-${mm}-${yyyy}`);
        loadAdminPanelData();
    }

    function startAdminEdit(stickerId) { editingId = stickerId; renderTableRows(); }
    function cancelAdminEdit() { editingId = null; renderTableRows(); }

    async function saveAdminEdit(stickerId) {
        const nameVal = document.getElementById(`inp-name-${stickerId}`).value.trim();
        const vehicleVal = document.getElementById(`inp-vehicle-${stickerId}`).value.trim();

        if (!nameVal || !vehicleVal) { alert("Values cannot be empty!"); return; }
        const updatePayload = { full_name: nameVal, vehicle_number: vehicleVal };

        await _supabase.from('registrations').update(updatePayload).eq('sticker_id', stickerId);
        editingId = null;
        alert("Details updated successfully!");
        loadAdminPanelData();
    }

    loadAdminPanelData();
</script>
</body>
</html>
