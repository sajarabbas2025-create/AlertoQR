    <title>AlertoQR | Advanced Admin Panel</title>

        .controls-row { margin-bottom: 25px; }

        td { padding: 10px 12px; border-bottom: 1px solid #e5e5ea; border-right: 1px solid #e5e5ea; color: #000; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        td:last-child { border-right: none; }
        tr:hover { background: #f9f9f9; }
        
        /* Column Width Definitions matching Supabase grid */
        .col-id { width: 120px; }
        .col-name { width: 220px; }
        .col-vehicle { width: 16px; }
        .col-phone { width: 180px; }
        .col-date { width: 180px; }
        
        /* Inline Live Editor Box Styling */
        .editable-cell { background: transparent; cursor: pointer; display: block; width: 100%; min-height: 20px; padding: 4px; border-radius: 4px; font-size: 14px; transition: background 0.2s; }
