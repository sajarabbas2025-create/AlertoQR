<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Admin Sticker Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #fff;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .admin-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { color: #38bdf8; margin-top: 0; font-size: 24px; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        input {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569;
            border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box;
        }
        input:focus { border-color: #38bdf8; outline: none; }
        
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; font-size: 14px; text-transform: uppercase; margin-bottom: 12px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-generate { background: #2563eb; color: #fff; }
        .btn-generate:hover { background: #1d4ed8; }
        .btn-download { background: #10b981; color: #fff; display: none; }
        .btn-download:hover { background: #059669; }

        /* Hidden standard container used to process QR data behind the scenes */
        #qr-raw-holder { display: none; }
        
        /* Studio Preview Box */
        .preview-area { margin-top: 25px; border-top: 1px dashed #334155; padding-top: 20px; display: none; }
        .preview-title { font-size: 12px; color: #eab308; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        canvas { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>AlertoQR Admin Panel</h2>
    <div class="subtitle">Sticker Batch & Graphic Generator Studio</div>

    <div class="form-group">
        <label>Enter New Sticker Serial ID</label>
        <input type="text" id="sticker_id_input" placeholder="e.g. AQ8001" style="text-transform: uppercase;">
    </div>

    <button onclick="generateCompleteSmartSticker()" class="btn btn-generate">⚙️ Generate Complete Sticker</button>
    <button id="download-btn" onclick="downloadStickerImage()" class="btn btn-download">💾 Download Print-Ready PNG</button>

    <div id="qr-raw-holder"></div>

    <div class="preview-area" id="preview-box">
        <div class="preview-title">👁️ Live Print Preview</div>
        <canvas id="stickerCanvas" width="400" height="400"></canvas>
    </div>
</div>

<script>
    let generatedStickerFileName = "alertoqr-sticker.png";

    function generateCompleteSmartSticker() {
        const idInput = document.getElementById('sticker_id_input').value.trim().toUpperCase();
        if (!idInput) {
            alert("Bhai, pehle Sticker ID toh daalo!");
            return;
        }

        generatedStickerFileName = `AlertoQR_${idInput}.png`;

        // 1. Clear old temporary data
        document.getElementById('qr-raw-holder').innerHTML = "";
        
        // Target dynamic landing destination path route
        const activationTargetUrl = `https://alertoqr.in/register.html?id=${idInput}`;

        // 2. Generate raw QR code inside the hidden block
        new QRCode(document.getElementById("qr-raw-holder"), {
            text: activationTargetUrl,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Wait a slight fraction for the library to draw the raw image, then draw the full sticker template layout
        setTimeout(() => {
            renderStickerGraphicTemplate(idInput);
        }, 300);
    }

    function renderStickerGraphicTemplate(stickerId) {
        const canvas = document.getElementById('stickerCanvas');
        const ctx = canvas.getContext('2d');
        
        // Clear frame grid canvas area before redraw operation
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- STEP A: CARD BACKGROUND AND MASTER FRAMING WRAPPER ---
        ctx.fillStyle = "#ffffff"; // Solid core base fill background
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- STEP B: HEADER CONTAINER COMPONENT (YELLOW STRIP) ---
        ctx.fillStyle = "#eab308"; // Solid high warning hazard notification amber yellow accent
        ctx.fillRect(0, 0, canvas.width, 65);

        // Header Border Accent Ring Base Layer
        ctx.fillStyle = "#d97706";
        ctx.fillRect(0, 61, canvas.width, 4);

        // Header Text elements rendering context operations
        ctx.fillStyle = "#000000";
        ctx.font = "bold 16px 'Segoe UI', Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚠️ EMERGENCY ALERTOQR CONTACT", canvas.width / 2, 28);
        
        ctx.font = "bold 11px 'Segoe UI', Arial, sans-serif";
        ctx.fillText("(गलत पार्किंग या समस्या होने पर स्कैन करें)", canvas.width / 2, 48);

        // --- STEP C: EMBED RAW QR CODE FRAME IMAGE FROM HIDDEN ELEMENT NODE ---
        const rawQrImg = document.querySelector('#qr-raw-holder img');
        if (rawQrImg) {
            // Drop shadow configuration for the QR square presentation look element frame area
            ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 4;
            
            // Draw standard central positioning boundary frame card space rectangle line borders
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(110, 95, 180, 180);
            ctx.drawImage(rawQrImg, 120, 105, 160, 160);
            
            // Revert configuration styling properties back to standard layout operational states immediately
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
        }

        // --- STEP D: STICKER SERIAL UNIQUE ID OVERLAY TAG EMBEDDED UNDER THE QR FRAME ---
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(140, 285, 120, 22);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px monospace";
        ctx.fillText(`ID: ${stickerId}`, canvas.width / 2, 300);

        // --- STEP E: BOTTOM CONTAINER CALL TO ACTION BAR SYSTEM SUBSTRATE ---
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 325, canvas.width, 75);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px 'Segoe UI', Arial, sans-serif";
        ctx.fillText("📞 SCAN TO CALL OWNER", canvas.width / 2, 352);

        ctx.fillStyle = "#10b981"; // Secure Privacy Protected system verification indicator branding accent line
        ctx.font = "600 11px 'Segoe UI', Arial, sans-serif";
        ctx.fillText("🔒 Privacy Protected | आपका नंबर सुरक्षित है", canvas.width / 2, 378);

        // Reveal final layout graphic control block tools
        document.getElementById('preview-box').style.display = 'block';
        document.getElementById('download-btn').style.display = 'flex';
    }

    function downloadStickerImage() {
        const canvas = document.getElementById('stickerCanvas');
        const imagePayloadData = canvas.toDataURL("image/png");
        
        const triggerVirtualAnchorLinkNode = document.createElement('a');
        triggerVirtualAnchorLinkNode.download = generatedStickerFileName;
        triggerVirtualAnchorLinkNode.href = imagePayloadData;
        
        document.body.appendChild(triggerVirtualAnchorLinkNode);
        triggerVirtualAnchorLinkNode.click();
        document.body.removeChild(triggerVirtualAnchorLinkNode);
    }
</script>
</body>
</html>
