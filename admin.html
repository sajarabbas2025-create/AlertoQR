<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Super Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }
        h2 { color: #38bdf8; margin: 0; }
        .btn-excel {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-excel:hover { background-color: #059669; }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        th { color: #94a3b8; text-transform: uppercase; font-size: 12px; }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background-color: #b45309; color: #fef3c7; }
        .status-active { background-color: #065f46; color: #d1fae5; }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }
        .btn-activate { background-color: #2563eb; color: white; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>AlertoQR Customer Registrations</h2>
        <button class="btn-excel" onclick="exportToExcel()">📥 EXPORT DATA TO EXCEL</button>
    </div>

    <div class="card">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Sticker ID</th>
                    <th>Owner Name</th>
                    <th>Vehicle Number</th>
                    <th>Mobile</th>
                    <th>Status</th>
                    <th>Action Controls</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="6" style="text-align:center; color:#94a3b8;">Loading registrations...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allData = [];

    async function fetchRegistrations() {
        try {
            const { data, error } = await _supabase
                .from('registrations')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;
            allData = data || [];
            renderTable(allData);
        } catch (err) {
            console.error(err);
            document.getElementById('table-body').innerHTML = `<tr><td colspan="6" style="color:#f87171; text-align:center;">Error: ${err.message}</td></tr>`;
        }
    }

    function renderTable(records) {
        const tbody = document.getElementById('table-body');
        if(records.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">Koi data nahi mila.</td></tr>`;
            return;
        }

        tbody.innerHTML = records.map(row => {
            const statusClass = row.status === 'Active' ? 'status-active' : 'status-pending';
            return `
                <tr>
                    <td style="font-weight:bold; color:#38bdf8;">${row.sticker_id}</td>
                    <td>${row.full_name}</td>
                    <td>${row.vehicle_number}</td>
                    <td>${row.mobile_number}</td>
                    <td><span class="status-badge ${statusClass}">${row.status || 'Pending'}</span></td>
                    <td>
                        ${row.status !== 'Active' ? `<button class="btn-action btn-activate" onclick="activateSticker('${row.sticker_id}')">⚡ Activate</button>` : ''}
                        <button class="btn-action btn-delete" onclick="deleteRegistration('${row.sticker_id}')">🗑️ Delete</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    async function activateSticker(id) {
        if(!confirm(`Kya aap Sticker ${id} ko active karna chahte hain?`)) return;
        const { error } = await _supabase.from('registrations').update({ status: 'Active' }).eq('sticker_id', id);
        if(error) alert("Error activating: " + error.message);
        else fetchRegistrations();
    }

    // 🗑️ DELETE REGISTRATION FUNCTION
    async function deleteRegistration(id) {
        if(!confirm(`⚠️ WARNING: Kya aap such me Sticker ID ${id} ka poora data delete karna chahte hain?`)) return;
        
        try {
            const { error } = await _supabase
                .from('registrations')
                .delete()
                .eq('sticker_id', id);

            if (error) throw error;
            alert(`Sticker ${id} successfully delete ho gaya.`);
            fetchRegistrations();
        } catch (err) {
            alert("Delete karne me error aaya: " + err.message);
        }
    }

    // 📥 EXPORT TO EXCEL FUNCTION
    function exportToExcel() {
        if(allData.length === 0) {
            alert("Export karne ke liye koi data nahi hai!");
            return;
        }

        const cleanRows = allData.map(item => ({
            "Sticker ID": item.sticker_id,
            "Customer Name": item.full_name,
            "Mobile Number": item.mobile_number,
            "Vehicle Number": item.vehicle_number,
            "Status": item.status || 'Pending',
            "Date Registered": item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A'
        }));

        const worksheet = XLSX.utils.json_to_sheet(cleanRows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Registrations");

        XLSX.writeFile(workbook, `AlertoQR_Customers_Report.xlsx`);
    }

    window.onload = fetchRegistrations;
</script>
</body>
</html>
