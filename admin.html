<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Super Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; margin: 0; }
        .admin-box { max-width: 1000px; margin: 0 auto; }
        .stats-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { flex: 1; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .stat-num { font-size: 28px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #fff; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .btn-active { background: #22c55e; color: #fff; }
        .btn-expire { background: #ef4444; color: #fff; }
        .btn-edit { background: #f59e0b; color: #fff; }
        input[type="text"] { background: #334155; color: #fff; border: 1px solid #475569; padding: 6px; border-radius: 6px; width: 85%; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>AlertoQR Control Room</h1>
    
    <div class="stats-grid">
        <div class="stat-card"><div>Total Earnings</div><div id="total-revenue" class="stat-num">₹0</div></div>
        <div class="stat-card"><div>Active Users</div><div id="active-count" class="stat-num">0</div></div>
        <div class="stat-card"><div>Expired Users</div><div id="expired-count" class="stat-num">0</div></div>
    </div>

    <h3>Customer Registrations & Plan Controls</h3>
    <table>
        <thead>
            <tr>
                <th>Sticker ID</th>
                <th>Owner Name</th>
                <th>Vehicle Number</th>
                <th>Status</th>
                <th>Action Controls</th>
            </tr>
        </thead>
        <tbody id="user-rows">
            <tr><td colspan="5" style="text-align:center;">Loading database records...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    let allUsers = [];

    async function loadAdminData() {
        let { data: users, error } = await _supabase.from('ragistrations').select('*');
        if(error || !users) {
            let { data: usersAlt } = await _supabase.from('registrations').select('*');
            users = usersAlt;
        }
        if(!users) {
            document.getElementById('user-rows').innerHTML = "<tr><td colspan='5' style='text-align:center; color:#ef4444;'>Table not found!</td></tr>";
            return;
        }
        allUsers = users;
        renderTable();
    }

    function renderTable() {
        let totalRevenue = 0;
        let activeCount = 0;
        let expiredCount = 0;
        let rowsHtml = "";

        allUsers.forEach((user, index) => {
            totalRevenue += Number(user.plan_price || 0);
            
            // PURE DATE BASED LOGIC: Agar expiry date aaj se badi hai toh Active, varna Expired.
            const today = new Date();
            today.setHours(0,0,0,0);
            
            let isExpired = true;
            if (user.expiary_date) {
                const expDate = new Date(user.expiary_date);
                expDate.setHours(0,0,0,0);
                if (expDate > today) {
                    isExpired = false;
                }
            }
            
            if(!isExpired) activeCount++;
            else expiredCount++;

            const statusToggleBtn = !isExpired 
                ? `<button class="btn-action btn-expire" onclick="toggleStatus('${user.sticker_id}', 'Expired')">Deactivate</button>`
                : `<button class="btn-action btn-active" onclick="toggleStatus('${user.sticker_id}', 'Active')">Activate</button>`;

            rowsHtml += `
                <tr id="row-${index}">
                    <td><strong>${user.sticker_id || 'N/A'}</strong></td>
                    <td id="name-${index}">${user.full_name || 'N/A'}</td>
                    <td id="vehicle-${index}" style="font-family:monospace;">${user.vehicle_number || 'N/A'}</td>
                    <td><span style="color:${!isExpired ? '#22c55e' : '#ef4444'}; font-weight:bold;">${isExpired ? 'Expired' : 'Active'}</span></td>
                    <td id="actions-${index}">
                        ${statusToggleBtn}
                        <button class="btn-action btn-edit" onclick="enableRowEdit(${index})">✏️ Edit</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById('total-revenue').innerText = "₹" + totalRevenue;
        document.getElementById('active-count').innerText = activeCount;
        document.getElementById('expired-count').innerText = expiredCount;
        document.getElementById('user-rows').innerHTML = rowsHtml || "<tr><td colspan='5'>No records found</td></tr>";
    }

    async function toggleStatus(id, newStatus) {
        let updateData = {};
        
        if(newStatus === 'Active') {
            const d = new Date();
            d.setFullYear(d.getFullYear() + 1); // 2027 set karega pure 1 saal ke liye
            updateData = {
                status: 'Active',
                expiary_date: d.toISOString().split('T')[0]
            };
        } else {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            updateData = {
                status: 'Expired',
                expiary_date: yesterday.toISOString().split('T')[0]
            };
        }

        let { error } = await _supabase.from('ragistrations').update(updateData).eq('sticker_id', id);
        if(error) {
            await _supabase.from('registrations').update(updateData).eq('sticker_id', id);
        }
        alert("Status Updated Successfully! 🚀");
        loadAdminData(); 
    }

    function enableRowEdit(index) {
        const user = allUsers[index];
        document.getElementById(`name-${index}`).innerHTML = `<input type="text" id="input-name-${index}" value="${user.full_name || ''}">`;
        document.getElementById(`vehicle-${index}`).innerHTML = `<input type="text" id="input-vehicle-${index}" value="${user.vehicle_number || ''}">`;
        document.getElementById(`actions-${index}`).innerHTML = `
            <button class="btn-action btn-active" onclick="saveRowEdit(${index})">💾 Save</button>
            <button class="btn-action btn-expire" onclick="renderTable()">Cancel</button>
        `;
    }

    async function saveRowEdit(index) {
        const user = allUsers[index];
        const updatedName = document.getElementById(`input-name-${index}`).value.trim();
        const updatedVehicle = document.getElementById(`input-vehicle-${index}`).value.trim();

        if(!updatedName || !updatedVehicle) { alert("Fields cannot be empty!"); return; }

        let updateData = { full_name: updatedName, vehicle_number: updatedVehicle };
        let { error } = await _supabase.from('ragistrations').update(updateData).eq('sticker_id', user.sticker_id);
        if(error) {
            await _supabase.from('registrations').update(updateData).eq('sticker_id', user.sticker_id);
        }
        alert("Record updated successfully!");
        loadAdminData();
    }

    loadAdminData();
</script>
</body>
</html>
