<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Exact original working style rules from your dashboard snapshot */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #cbd5e1;
            margin: 0;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .admin-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 540px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 16px;
            color: #334155;
            box-sizing: border-box;
            background-color: #f8fafc;
            margin-bottom: 20px;
        }
        .btn-submit {
            background-color: #0047ab;
            color: #ffffff;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #003380;
        }

        /* Technical process space for engine background processing */
        #qr-raw-holder { display: none; }

        /* Output presentation frame strictly separated below */
        .sticker-output-block {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        canvas {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        .btn-download-sticker {
            background-color: #10b981;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            text-transform: uppercase;
        }
        .btn-download-sticker:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>AlertoQR Admin Dashboard</h2>
    
    <div class="form-group">
        <label class="form-label">Enter Sticker Serial ID:</label>
        <input type="text" id="sticker_id_input" placeholder="E.G. ALQR003" style="text-transform: uppercase;">
    </div>
    
    <button onclick="executeOriginalSystemGeneration()" class="btn-submit">Generate QR Code</button>

    <div id="qr-raw-holder"></div>

    <div class="sticker-output-block" id="output-block">
        <canvas id="stickerCanvas" width="400" height="400"></canvas>
        <button onclick="triggerDirectDownload()" class="btn-download-sticker">💾 Download Print-Ready Sticker</button>
    </div>
</div>

<script>
    let targetDownloadFilename = "sticker.png";

    function executeOriginalSystemGeneration() {
        const idValue = document.getElementById('sticker_id_input').value.trim().toUpperCase();
        if (!idValue) {
            alert("Please enter a valid Sticker ID!");
            return;
        }

        targetDownloadFilename = `AlertoQR_${idValue}.png`;
        document.getElementById('qr-raw-holder').innerHTML = "";
        
        // Target dynamic redirection deployment mapping 
        const routingTargetUrl = `https://alertoqr.in/register.html?id=${idValue}`;

        new QRCode(document.getElementById("qr-raw-holder"), {
            text: routingTargetUrl,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        setTimeout(() => {
            compileStickerLayoutMatrix(idValue);
        }, 300);
    }

    function compileStickerLayoutMatrix(stickerId) {
        const canvas = document.getElementById('stickerCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Core Background Structure
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Sticker Layout Warning Strip (Yellow top frame)
        ctx.fillStyle = "#eab308";
        ctx.fillRect(0, 0, canvas.width, 65);
        ctx.fillStyle = "#d97706";
        ctx.fillRect(0, 61, canvas.width, 4);

        // 3. Instruction Content Strings
        ctx.fillStyle = "#000000";
        ctx.font = "bold 16px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚠️ EMERGENCY ALERTOQR CONTACT", canvas.width / 2, 28);
        ctx.font = "bold 11px Arial, sans-serif";
        ctx.fillText("(गलत पार्किंग या समस्या होने पर स्कैन करें)", canvas.width / 2, 48);

        // 4. Inject Raw Engine Image onto Active Template Canvas
        const sourceImg = document.querySelector('#qr-raw-holder img');
        if (sourceImg) {
            ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
            ctx.shadowBlur = 10;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(110, 95, 180, 180);
            ctx.drawImage(sourceImg, 120, 105, 160, 160);
            ctx.shadowBlur = 0;
        }

        // 5. Unique Static ID Badge Overlay 
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(140, 285, 120, 22);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px monospace";
        ctx.fillText(`ID: ${stickerId}`, canvas.width / 2, 300);

        // 6. Base Call-To-Action Board Banner (Black lower panel anchor)
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 325, canvas.width, 75);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px Arial, sans-serif";
        ctx.fillText("📞 SCAN TO CALL OWNER", canvas.width / 2, 352);
        ctx.fillStyle = "#10b981";
        ctx.font = "600 11px Arial, sans-serif";
        ctx.fillText("🔒 Privacy Protected | आपका नंबर सुरक्षित है", canvas.width / 2, 378);

        // Turn output container visibility state alive
        document.getElementById('output-block').style.display = 'block';
    }

    function triggerDirectDownload() {
        const canvas = document.getElementById('stickerCanvas');
        const imgStream = canvas.toDataURL("image/png");
        const downloadAnchor = document.createElement('a');
        downloadAnchor.download = targetDownloadFilename;
        downloadAnchor.href = imgStream;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
    }
</script>
</body>
</html>
