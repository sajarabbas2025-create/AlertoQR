<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Aapka bilkul purana normal white styling layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #fff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #222;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        
        /* Hidden layout area for library background work */
        #qr-raw-holder { display: none; }

        /* QR & Sticker Output Section */
        .output-section {
            margin-top: 25px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 15px;
            max-width: 100%;
            height: auto;
        }
        .btn-download {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            width: 100%;
            text-transform: uppercase;
        }
        .btn-download:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AlertoQR Admin Dashboard</h1>
    
    <div class="input-group">
        <label for="sticker_id_input">Enter Sticker Serial ID:</label>
        <input type="text" id="sticker_id_input" placeholder="e.g. ALQR003" style="text-transform: uppercase;">
    </div>
    
    <button onclick="processOldPanelQR()" class="btn-submit">Generate QR Code</button>

    <div id="qr-raw-holder"></div>

    <div class="output-section">
        <canvas id="stickerCanvas" width="400" height="400" style="display:none;"></canvas>
        <button id="download-btn" onclick="downloadStickerImage()" class="btn-download">💾 Download Print-Ready Sticker</button>
    </div>
</div>

<script>
    let filenameTracker = "sticker.png";

    function processOldPanelQR() {
        const idInput = document.getElementById('sticker_id_input').value.trim().toUpperCase();
        if (!idInput) {
            alert("Please enter a valid Sticker ID!");
            return;
        }

        filenameTracker = `AlertoQR_${idInput}.png`;
        document.getElementById('qr-raw-holder').innerHTML = "";
        
        // Dynamic registration routing path
        const targetActivationUrl = `https://alertoqr.in/register.html?id=${idInput}`;

        // Generating standard QR behind the scenes
        new QRCode(document.getElementById("qr-raw-holder"), {
            text: targetActivationUrl,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Instant delay rendering to embed inside your sticker template on canvas
        setTimeout(() => {
            renderStickerOnCanvas(idInput);
        }, 300);
    }

    function renderStickerOnCanvas(stickerId) {
        const canvas = document.getElementById('stickerCanvas');
        const ctx = canvas.getContext('2d');
        
        // Clear frame before redraw
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Base White Background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Yellow Alert Header Bar
        ctx.fillStyle = "#eab308";
        ctx.fillRect(0, 0, canvas.width, 65);
        ctx.fillStyle = "#d97706";
        ctx.fillRect(0, 61, canvas.width, 4);

        // 3. Header Texts
        ctx.fillStyle = "#000000";
        ctx.font = "bold 16px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚠️ EMERGENCY ALERTOQR CONTACT", canvas.width / 2, 28);
        ctx.font = "bold 11px Arial, sans-serif";
        ctx.fillText("(गलत पार्किंग या समस्या होने पर स्कैन करें)", canvas.width / 2, 48);

        // 4. Inject Raw QR Code inside design context
        const rawQrImg = document.querySelector('#qr-raw-holder img');
        if (rawQrImg) {
            ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
            ctx.shadowBlur = 10;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(110, 95, 180, 180);
            ctx.drawImage(rawQrImg, 120, 105, 160, 160);
            ctx.shadowBlur = 0;
        }

        // 5. Unique Identification Code Label
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(140, 285, 120, 22);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px monospace";
        ctx.fillText(`ID: ${stickerId}`, canvas.width / 2, 300);

        // 6. Bottom CTA Footer Strip (Black)
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 325, canvas.width, 75);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px Arial, sans-serif";
        ctx.fillText("📞 SCAN TO CALL OWNER", canvas.width / 2, 352);
        ctx.fillStyle = "#10b981";
        ctx.font = "600 11px Arial, sans-serif";
        ctx.fillText("🔒 Privacy Protected | आपका नंबर सुरक्षित है", canvas.width / 2, 378);

        // Display results without altering any core elements
        canvas.style.display = 'inline-block';
        document.getElementById('download-btn').style.display = 'block';
    }

    function downloadStickerImage() {
        const canvas = document.getElementById('stickerCanvas');
        const dataUrl = canvas.toDataURL("image/png");
        const createAnchor = document.createElement('a');
        createAnchor.download = filenameTracker;
        createAnchor.href = dataUrl;
        document.body.appendChild(createAnchor);
        createAnchor.click();
        document.body.removeChild(createAnchor);
    }
</script>
</body>
</html>
