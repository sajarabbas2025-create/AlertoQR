<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; margin: 0; }
        .welcome { background: #d4edda; color: #155724; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; border-left: 4px solid #28a745; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #ddd; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        .stat-box { background: #fff; padding: 20px; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; display: block; }
        .val { font-size: 28px; font-weight: 800; }
        .active { color: #008080; } .unpaid { color: #dc3545; } .rev { color: #0056b3; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; background: #f9f9f9; }
        button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="welcome">✓ Welcome, admin.</div>
    <div class="stats-grid">
        <div class="stat-box"><span class="label">Total Stickers</span><span class="val">7</span></div>
        <div class="stat-box"><span class="label">Registered</span><span class="val" id="regCount">0</span></div>
        <div class="stat-box"><span class="label">Active</span><span class="val active">4</span></div>
        <div class="stat-box"><span class="label">Paid</span><span class="val">4</span></div>
        <div class="stat-box"><span class="label">Unpaid (Reg.)</span><span class="val unpaid">1</span></div>
        <div class="stat-box"><span class="label">Revenue</span><span class="val rev">₹1,196</span></div>
    </div>
    <div class="card">
        <span class="label">Create Stickers</span>
        <h2 style="margin: 5px 0 20px;">Generate sticker IDs</h2>
        <span class="label">Quantity (1-100)</span>
        <input type="number" value="1">
        <button>Generate</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = supabase.createClient('https://cefzsgchfdvtyfmcrsda.supabase.co', 'sb_publishable_8jfL5f4ayg8oNGIo_BrWwQ_9fORRRn7C7Yp192Aba3a059d9f67a6bc66a4f89d3a17e089608');
        async function fetchStats() {
            const { count } = await supabase.from('registrations').select('*', { count: 'exact', head: true });
            document.getElementById('regCount').innerText = count || 0;
        }
        fetchStats();
    </script>
</body>
</html>
