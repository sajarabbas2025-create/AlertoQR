<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Super Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #fff; font-size: 28px; margin-bottom: 25px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        
        /* Stats Styling */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 24px; font-weight: bold; color: #38bdf8; }
        
        /* Bulk QR Section Styling */
        .panel-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 20px; margin-bottom: 30px; }
        h2 { margin-top: 0; font-size: 18px; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .input-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-field { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 10px; border-radius: 6px; font-size: 14px; flex: 1; min-width: 120px; }
        
        /* QR Output Display Grid */
        .qr-display-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; max-height: 400px; overflow-y: auto; }
        .qr-card { background: white; padding: 12px; border-radius: 8px; text-align: center; width: 130px; margin: 0 auto; }
        .qr-holder { display: flex; justify-content: center; margin-bottom: 5px; }
        .sticker-id { font-weight: bold; font-size: 14px; color: #0f172a; font-family: monospace; }
        .brand-name { font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #10b981; color: #fff; }

        @media print {
            body { background: white; color: black; padding: 0; }
            .container > *:not(#qr-print-section-wrapper) { display: none !important; }
            .container { max-width: 100%; }
            #qr-print-section-wrapper { border: none; background: transparent; padding: 0; }
            #qr-print-section-wrapper h2, #qr-print-section-wrapper div:not(.qr-display-grid) { display: none !important; }
            .qr-display-grid { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 20px !important; max-height: none !important; overflow: visible !important; background: transparent !important; border: none !important; padding: 0 !important; }
            .qr-card { border: 1px dashed #000 !important; box-shadow: none !important; page-break-inside: avoid !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AlertoQR Control Panel (Bypass Mode)</h1>

    <div class="stats-grid">
        <div class="stat-card"><h3>Total Earnings</h3><p>₹0</p></div>
        <div class="stat-card"><h3>Active Users</h3><p style="color: #4ade80;">1</p></div>
        <div class="stat-card"><h3>Expired Users</h3><p style="color: #f87171;">0</p></div>
    </div>

    <div class="panel-card" id="qr-print-section-wrapper">
        <h2>🖨️ Smart Bulk QR Code Generator</h2>
        
        <div class="input-group">
            <div style="flex: 1; min-width: 150px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: bold;">Series Code (Prefix)</label>
                <input type="text" id="qr-prefix" class="input-field" style="width: 100%; box-sizing: border-box;" value="ALQR">
            </div>
            
            <div style="flex: 1; min-width: 120px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: bold;">Start No.</label>
                <input type="number" id="qr-start" class="input-field" style="width: 100%; box-sizing: border-box;" value="1">
            </div>
            
            <div style="flex: 1; min-width: 120px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: bold;">End No.</label>
                <input type="number" id="qr-end" class="input-field" style="width: 100%; box-sizing: border-box;" value="10">
            </div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="generateAdminBulkQRs()">🚀 Generate QR Codes</button>
            <button class="btn btn-success" id="btn-print-qr" onclick="window.print()" style="display: none;">🖨️ Print Generated QR Sheets</button>
        </div>
        
        <div class="qr-display-grid" id="qr-print-section" style="display: none;"></div>
    </div>
</div>

<script>
    function generateAdminBulkQRs() {
        const prefix = document.getElementById('qr-prefix').value.trim().toUpperCase();
        const startNum = parseInt(document.getElementById('qr-start').value);
        const endNum = parseInt(document.getElementById('qr-end').value);
        const displayGrid = document.getElementById('qr-print-section');
        
        if (!prefix || isNaN(startNum) || isNaN(endNum) || startNum > endNum) {
            alert("Please input valid Series Configuration.");
            return;
        }

        displayGrid.innerHTML = '';
        displayGrid.style.display = 'grid';

        // Dashboard Link generate karne ke liye path sets
        const currentDomain = window.location.origin + window.location.pathname.replace('admin.html', 'dashboard.html');
        const baseDashboardUrl = `${currentDomain}?id=`;

        for (let i = startNum; i <= endNum; i++) {
            const formattedNum = String(i).padStart(3, '0');
            const currentStickerId = `${prefix}${formattedNum}`;
            const finalScanUrl = `${baseDashboardUrl}${currentStickerId}`;

            const qrCard = document.createElement('div');
            qrCard.className = 'qr-card';
            qrCard.innerHTML = `
                <div class="brand-name">AlertoQR</div>
                <div class="qr-holder" id="admin-qr-${currentStickerId}"></div>
                <div class="sticker-id">${currentStickerId}</div>
            `;
            displayGrid.appendChild(qrCard);

            new QRCode(document.getElementById(`admin-qr-${currentStickerId}`), {
                text: finalScanUrl,
                width: 110,
                height: 110,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        document.getElementById('btn-print-qr').style.display = 'inline-block';
    }
</script>
</body>
</html>
