<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Super Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #fff; font-size: 28px; margin-bottom: 25px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 24px; font-weight: bold; color: #38bdf8; }
        .panel-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 20px; margin-bottom: 30px; }
        h2 { margin-top: 0; font-size: 18px; color: #fff; margin-bottom: 15px; }
        .input-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-field { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 10px; border-radius: 6px; font-size: 14px; flex: 1; min-width: 120px; }
        .qr-display-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; max-height: 400px; overflow-y: auto; }
        .qr-card { background: white; padding: 12px; border-radius: 8px; text-align: center; width: 130px; margin: 0 auto; }
        .qr-holder { display: flex; justify-content: center; margin-bottom: 5px; }
        .sticker-id { font-weight: bold; font-size: 14px; color: #0f172a; font-family: monospace; }
        .brand-name { font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-size: 13px; text-transform: uppercase; }
        td { color: #f8fafc; font-size: 14px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #16a34a; color: #fff; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-edit { background: #eab308; color: #fff; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-success { background: #10b981; color: #fff; }
        .loading { text-align: center; color: #94a3b8; padding: 20px; }
        @media print {
            body { background: white; color: black; padding: 0; }
            .container > *:not(#qr-print-section-wrapper) { display: none !important; }
            .qr-display-grid { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 20px !important; max-height: none !important; overflow: visible !important; background: transparent !important; border: none !important; }
            .qr-card { border: 1px dashed #000 !important; page-break-inside: avoid !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AlertoQR Control Panel</h1>

    <div class="stats-grid">
        <div class="stat-card"><h3>Total Earnings</h3><p id="stat-earnings">₹0</p></div>
        <div class="stat-card"><h3>Active Users</h3><p id="stat-active" style="color: #4ade80;">0</p></div>
        <div class="stat-card"><h3>Expired Users</h3><p id="stat-expired" style="color: #f87171;">0</p></div>
    </div>

    <div class="panel-card" id="qr-print-section-wrapper">
        <h2>🖨️ Smart Bulk QR Code Generator</h2>
        
        <div id="counter-reminder" style="background: #1e293b; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; color: #38bdf8; display: block; border-left: 4px solid #38bdf8; font-weight: 500;">
            ⏳ Connecting to Database to check history...
        </div>

        <div class="input-group">
            <div style="flex: 1; min-width: 150px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px;">Series Code (Prefix)</label>
                <input type="text" id="qr-prefix" class="input-field" style="width: 100%; box-sizing: border-box;" value="ALQR" oninput="calculateNextAvailableNumber()">
            </div>
            <div style="flex: 1; min-width: 120px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px;">Start No.</label>
                <input type="number" id="qr-start" class="input-field" style="width: 100%; box-sizing: border-box;" value="1">
            </div>
            <div style="flex: 1; min-width: 120px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px;">End No.</label>
                <input type="number" id="qr-end" class="input-field" style="width: 100%; box-sizing: border-box;" value="10">
            </div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="generateAdminBulkQRs()">🚀 Generate QR Codes</button>
            <button class="btn btn-success" id="btn-print-qr" onclick="window.print()" style="display: none;">🖨️ Print Sheets</button>
        </div>
        <div class="qr-display-grid" id="qr-print-section" style="display: none;"></div>
    </div>

    <div class="panel-card">
        <h2>👥 Customer Registrations & Plan Controls</h2>
        <div id="loading-text" class="loading">Loading database records...</div>
        <div class="table-wrapper">
            <table id="data-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Sticker ID</th>
                        <th>Owner Name</th>
                        <th>Vehicle Number</th>
                        <th>Status</th>
                        <th>Expiry Date</th>
                        <th>Action Controls</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allRegisteredIDs = new Set();
    let allRecords = [];

    // 1️⃣ DATABASE SE UPCOMING DATA AUR NUMBERS FETCH KARNA
    async function loadAdminPanelData() {
        let { data: records, error } = await _supabase.from('registrations').select('*').order('created_at', { ascending: false });
        
        document.getElementById('loading-text').style.display = 'none';
        document.getElementById('data-table').style.display = 'table';

        if (records) {
            allRecords = records;
            allRegisteredIDs.clear();
            
            records.forEach(row => {
                if(row.sticker_id) allRegisteredIDs.add(row.sticker_id.toUpperCase().trim());
            });

            // Update Dashboard Stats dynamically
            document.getElementById('stat-active').innerText = records.length;
            document.getElementById('stat-earnings').innerText = `₹${records.length * 299}`;
            
            renderTableRows();
            calculateNextAvailableNumber();
        }
    }

    // 2️⃣ DYNAMIC SMART SUGGESTION ENGINE
    function calculateNextAvailableNumber() {
        const prefix = document.getElementById('qr-prefix').value.trim().toUpperCase();
        if (!prefix) return;

        let maxNum = 0;
        allRegisteredIDs.forEach(id => {
            if (id.startsWith(prefix)) {
                const numPart = id.replace(prefix, '');
                const parsed = parseInt(numPart);
                if (!isNaN(parsed) && parsed > maxNum) {
                    maxNum = parsed;
                }
            }
        });

        const nextNum = maxNum + 1;
        document.getElementById('qr-start').value = nextNum;
        document.getElementById('qr-end').value = nextNum + 9; // Auto Suggest 10 codes gap

        const reminder = document.getElementById('counter-reminder');
        if (maxNum > 0) {
            reminder.style.background = "#1e293b";
            reminder.style.color = "#38bdf8";
            reminder.style.borderLeft = "4px solid #38bdf8";
            reminder.innerText = `✅ Series '${prefix}' has records up to No. ${maxNum}. Setting Safe Start Number to: ${nextNum}`;
        } else {
            reminder.style.background = "#0f172a";
            reminder.style.color = "#4ade80";
            reminder.style.borderLeft = "4px solid #4ade80";
            reminder.innerText = `💡 Series '${prefix}' is completely fresh! No previous records found. Start from No. 1.`;
        }
    }

    // 3️⃣ SMART GENERATOR WITH DUPLICATE BLOCKER
    function generateAdminBulkQRs() {
        const prefix = document.getElementById('qr-prefix').value.trim().toUpperCase();
        const startNum = parseInt(document.getElementById('qr-start').value);
        const endNum = parseInt(document.getElementById('qr-end').value);
        const displayGrid = document.getElementById('qr-print-section');
        
        if (!prefix || isNaN(startNum) || isNaN(endNum) || startNum > endNum) {
            alert("Please input valid range numbers.");
            return;
        }

        // 🚨 CRITICAL CHECK: Block generation if requested start overlaps existing data
        let duplicatesFound = [];
        for (let i = startNum; i <= endNum; i++) {
            const checkId = `${prefix}${String(i).padStart(3, '0')}`;
            if (allRegisteredIDs.has(checkId)) {
                duplicatesFound.push(checkId);
            }
        }

        if (duplicatesFound.length > 0) {
            alert(`⛔ STOP! Generation Blocked!\n\nThe following QR IDs already exist in the database:\n${duplicatesFound.join(', ')}\n\nPlease increase your 'Start No.' to prevent overlapping data.`);
            return;
        }

        displayGrid.innerHTML = '';
        displayGrid.style.display = 'grid';
        const baseDashboardUrl = "https://sajarabbas2025-create.github.io/AlertoQR/dashboard.html?id=";

        for (let i = startNum; i <= endNum; i++) {
            const formattedNum = String(i).padStart(3, '0');
            const currentStickerId = `${prefix}${formattedNum}`;
            const finalScanUrl = `${baseDashboardUrl}${currentStickerId}`;

            const qrCard = document.createElement('div');
            qrCard.className = 'qr-card';
            qrCard.innerHTML = `
                <div class="brand-name">AlertoQR</div>
                <div class="qr-holder" id="admin-qr-${currentStickerId}"></div>
                <div class="sticker-id">${currentStickerId}</div>
            `;
            displayGrid.appendChild(qrCard);

            new QRCode(document.getElementById(`admin-qr-${currentStickerId}`), {
                text: finalScanUrl,
                width: 110,
                height: 110,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
        document.getElementById('btn-print-qr').style.display = 'inline-block';
    }

    function renderTableRows() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        allRecords.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${row.sticker_id}</b></td>
                <td>${row.full_name || 'N/A'}</td>
                <td>${row.vehicle_number || 'N/A'}</td>
                <td><span class="badge badge-active">Active</span></td>
                <td>19-05-2027</td>
                <td><button class="btn btn-edit">✏️ Edit</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    loadAdminPanelData();
</script>
</body>
</html>
