<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertoQR | Super Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 30px; font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
        
        /* 📊 Stats Counter Grid Box */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }
        .stat-card p { margin: 0; font-size: 32px; font-weight: bold; }
        .stat-earning { color: #38bdf8; }
        .stat-active { color: #10b981; }
        .stat-expired { color: #ef4444; }

        /* 🖨️ Bulk QR Box */
        .section-box { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .section-title { font-size: 18px; color: #f8fafc; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { text-align: left; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px; }
        
        /* 🕹️ Buttons UI */
        .btn { padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #10b981; color: #fff; padding: 6px 12px; font-size: 12px; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #dc2626; color: #fff; padding: 6px 12px; font-size: 12px; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-edit { background: #eab308; color: #0f172a; padding: 6px 12px; font-size: 12px; }

        /* 📋 Table Styles */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; font-size: 14px; }
        th { background: #0f172a; color: #94a3b8; padding: 12px; border-bottom: 2px solid #334155; font-weight: 600; text-transform: uppercase; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid #334155; color: #cbd5e1; vertical-align: middle; }
        tr:hover { background: #1e293b60; }
        
        /* 🏷️ Status Badges */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .badge-pending { background: rgba(234, 179, 8, 0.2); color: #eab308; border: 1px solid #eab308; }

        /* QR Print Container (Hidden on main screen) */
        #print-area { display: none; background: white; padding: 20px; }
        .qr-print-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
        .qr-card { border: 2px dashed #000; padding: 10px; color: black; font-family: sans-serif; background: #fff; border-radius: 8px; }
        
        @media print {
            body * { display: none; }
            #print-area, #print-area * { display: block; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AlertoQR Control Control Panel</h1>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Earnings</h3>
            <p class="stat-earning" id="stat-earnings">₹0</p>
        </div>
        <div class="stat-card">
            <h3>Active Users</h3>
            <p class="stat-active" id="stat-active">0</p>
        </div>
        <div class="stat-card">
            <h3>Expired / Pending Users</h3>
            <p class="stat-expired" id="stat-expired">0</p>
        </div>
    </div>

    <div class="section-box">
        <div class="section-title">🖨️ Smart Bulk QR Code Generator</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Series Code (Prefix)</label>
                <input type="text" id="qr-prefix" value="ALQR">
            </div>
            <div class="form-group">
                <label>Start No.</label>
                <input type="number" id="qr-start" value="1">
            </div>
            <div class="form-group">
                <label>End No.</label>
                <input type="number" id="qr-end" value="10">
            </div>
        </div>
        <button class="btn btn-primary" onclick="generateBulkQRIntents()">🚀 Generate QR Codes</button>
        <button class="btn btn-primary" style="background: #10b981; margin-left: 10px; display: none;" id="btn-print-sheet" onclick="window.print()">🖨️ Print Generated QR Sheets</button>
    </div>

    <div class="section-box">
        <div class="section-title">👥 Customer Registrations & Plan Controls</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Sticker ID</th>
                        <th>Owner Name</th>
                        <th>Vehicle Number</th>
                        <th>Mobile</th>
                        <th>Status</th>
                        <th>Expiry Date</th>
                        <th>Action Controls</th>
                    </tr>
                </thead>
                <tbody id="registrations-table-body">
                    <tr>
                        <td colspan="7" style="text-align: center; color: #94a3b8;">Loading database records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="print-area">
    <div class="qr-print-grid" id="print-grid-box"></div>
</div>

<script>
    // Supabase Connection Framework
    const supabaseUrl = 'https://cefzsgchfdvtyfmcrsda.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZnpzZ2NoZmR2dHlmbWNyc2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTU5NTgsImV4cCI6MjA5NDQzMTk1OH0.JhuJVKqX6xMbWQ7bmsraY3DjVKbsXMNzl0h6ljePTxs';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 🔄 Fetch and Render Registrations Grid Table Data
    async function loadAdminDashboardData() {
        let { data, error } = await _supabase
            .from('registrations')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("Error loading table content:", error);
            return;
        }

        const tbody = document.getElementById('registrations-table-body');
        tbody.innerHTML = ""; // Clear existing text rows

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color:#94a3b8;">No registered records found in Database.</td></tr>`;
            updateStatsUI(0, 0, 0);
            return;
        }

        let totalEarnings = 0;
        let activeCount = 0;
        let pendingCount = 0;

        data.forEach(row => {
            // Stats Calculation logic setup
            if (row.status === 'Active') {
                totalEarnings += 299;
                activeCount++;
            } else {
                pendingCount++;
            }

            const statusClass = row.status === 'Active' ? 'badge-active' : 'badge-pending';
            const actionButtonHTML = row.status === 'Active' 
                ? `<button class="btn btn-danger" onclick="toggleActivation('${row.sticker_id}', 'Active')">🛑 Deactivate</button>` 
                : `<button class="btn btn-success" onclick="toggleActivation('${row.sticker_id}', 'Pending')">⚡ Activate (1 Year)</button>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: bold; color: #f8fafc;">${row.sticker_id}</td>
                <td>${row.full_name || 'N/A'}</td>
                <td style="letter-spacing: 0.5px;">${row.vehicle_number || 'N/A'}</td>
                <td>${row.mobile_number || 'N/A'}</td>
                <td><span class="badge ${statusClass}">${row.status || 'Pending'}</span></td>
                <td>${row.expiry_date || 'N/A'}</td>
                <td>
                    ${actionButtonHTML}
                    <button class="btn btn-edit" style="margin-left:5px;" onclick="promptEditData('${row.sticker_id}', '${row.full_name}', '${row.vehicle_number}', '${row.mobile_number}')">✏️ Edit</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        updateStatsUI(totalEarnings, activeCount, pendingCount);
    }

    // 📊 Update Counter Top Metrics Boxes
    function updateStatsUI(earnings, active, pending) {
        document.getElementById('stat-earnings').innerText = `₹${earnings}`;
        document.getElementById('stat-active').innerText = active;
        document.getElementById('stat-expired').innerText = pending;
    }

    // 🔄 CORE TOGGLE FUNCTION: Manual Overriding Control Panels
    async function toggleActivation(stickerId, currentStatus) {
        const targetNewStatus = (currentStatus === 'Active') ? 'Pending' : 'Active';
        
        // Calculate 1-Year Expiry String dynamically from current timestamp
        let expiryDate = new Date();
        expiryDate.setFullYear(expiryDate.getFullYear() + 1);
        const formattedExpiryString = expiryDate.toISOString().split('T')[0];

        const { error } = await _supabase
            .from('registrations')
            .update({ 
                status: targetNewStatus,
                expiry_date: targetNewStatus === 'Active' ? formattedExpiryString : null
            })
            .eq('sticker_id', stickerId);

        if (error) {
            alert("Database write error: " + error.message);
        } else {
            alert(`Sticker ${stickerId} is now updated to: ${targetNewStatus.toUpperCase()}`);
            loadAdminDashboardData(); // Refresh UI instant
        }
    }

    // ✏️ MANUAL DATA EDIT OVERRIDE PANEL PROMPT BOX
    async function promptEditData(stickerId, oldName, oldVehicle, oldMobile) {
        const newName = prompt("Update Owner Full Name:", oldName);
        if (newName === null) return;
        const newVehicle = prompt("Update Vehicle Number:", oldVehicle);
        if (newVehicle === null) return;
        const newMobile = prompt("Update Mobile Contact Number:", oldMobile);
        if (newMobile === null) return;

        const { error } = await _supabase
            .from('registrations')
            .update({
                full_name: newName.trim(),
                vehicle_number: newVehicle.trim().toUpperCase(),
                mobile_number: newMobile.trim()
            })
            .eq('sticker_id', stickerId);

        if (error) { alert("Update failed."); } 
        else { alert("Details Updated."); loadAdminDashboardData(); }
    }

    // 🖨️ BULK QR BUILDER INTENTS LOOPER GENERATOR
    function generateBulkQRIntents() {
        const prefix = document.getElementById('qr-prefix').value.trim().toUpperCase();
        const start = parseInt(document.getElementById('qr-start').value);
        const end = parseInt(document.getElementById('qr-end').value);

        if (!prefix || isNaN(start) || isNaN(end) || start > end) {
            alert("Invalid configuration values input ranges!");
            return;
        }

        const printGridBox = document.getElementById('print-grid-box');
        printGridBox.innerHTML = ""; // Reset print template container canvas

        // Base domain configuration logic dynamically fetched
        const hostUrl = window.location.origin + window.location.pathname.replace('admin.html', 'register.html');

        for (let i = start; i <= end; i++) {
            // Formatted string generation padding (e.g., AGRA001, ALQR005)
            const idNumberString = String(i).padStart(3, '0');
            const targetStickerID = `${prefix}${idNumberString}`;
            const targetScanRedirectURL = `${hostUrl}?id=${targetStickerID}`;

            // Create Google Chart API QR Generator image element mapping links
            const qrImageSource = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(targetScanRedirectURL)}`;

            const card = document.createElement('div');
            card.className = 'qr-card';
            card.innerHTML = `
                <div style="font-size:11px; font-weight:bold; margin-bottom:5px; letter-spacing:1px; color:#000;">ALERTOQR</div>
                <img src="${qrImageSource}" alt="QR" style="width:130px; height:130px; display:block; margin:0 auto;">
                <div style="font-size:12px; font-weight:bold; margin-top:5px; font-family:monospace; color:#000;">${targetStickerID}</div>
            `;
            printGridBox.appendChild(card);
        }

        // Unhide print button triggers
        document.getElementById('btn-print-sheet').style.display = 'inline-flex';
        alert(`🎉 Sheet containing ${((end - start) + 1)} high-res QR instances mapped ready! Click green print button.`);
    }

    // Run core routines inside main loop initialization context
    loadAdminDashboardData();
</script>
</body>
</html>
